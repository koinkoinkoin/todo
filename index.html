  --warn: #9a6200;
  --warn-weak: #fcf1d8;
  --ok: #138a13;
  --ok-weak: #e4f3e4;
  --meet: #5a48cc;
  --meet-weak: #eeecfb;
  --p1: #d03b3b;
  --p2: #d08c00;
  --p3: #a9a8a0;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --s0: #bdbcb4;
  --chart-surface: #ffffff;
  --grid: #e8e7e1;
  --axis: #c3c2b7;
  --shadow: 0 1px 2px rgba(0,0,0,.05), 0 8px 24px rgba(0,0,0,.08);
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
:root[data-theme="dark"] { color-scheme: dark;
    --bg: #111110; --panel: #171716; --surface: #1d1d1c; --hover: #262624; --line: #2e2e2b; --line-2: #3d3d39;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8e8d86;
    --accent: #4b93ea; --accent-ink: #86b6ef; --accent-weak: #1a2a3e;
    --danger: #ec7272; --danger-weak: #3a1f1f; --warn: #e3aa45; --warn-weak: #33290f; --ok: #3fbf3f; --ok-weak: #15301a;
    --meet: #a69cf0; --meet-weak: #27223f;
    --p1: #e66767; --p2: #d29a2a; --p3: #6f6e68;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s0: #5f5e59;
    --chart-surface: #1d1d1c; --grid: #2c2c2a; --axis: #45453f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --toast: #3b3b38; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { color-scheme: dark;
    --bg: #111110; --panel: #171716; --surface: #1d1d1c; --hover: #262624; --line: #2e2e2b; --line-2: #3d3d39;
    --ink: #f0efec; --ink-2: #c3c2b7; --ink-3: #8e8d86;
    --accent: #4b93ea; --accent-ink: #86b6ef; --accent-weak: #1a2a3e;
    --danger: #ec7272; --danger-weak: #3a1f1f; --warn: #e3aa45; --warn-weak: #33290f; --ok: #3fbf3f; --ok-weak: #15301a;
    --meet: #a69cf0; --meet-weak: #27223f;
    --p1: #e66767; --p2: #d29a2a; --p3: #6f6e68;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --s0: #5f5e59;
    --chart-surface: #1d1d1c; --grid: #2c2c2a; --axis: #45453f;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 28px rgba(0,0,0,.45); --toast: #3b3b38; }
}

/* ====== Base ====== */
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { font: 14px/1.45 var(--font); color: var(--ink); background: var(--bg); overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 650; }
[hidden] { display: none !important; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.spacer { flex: 1; }
.ic { flex: none; display: block; }
.scroll { overflow: auto; min-height: 0; }
.scroll::-webkit-scrollbar { width: 10px; height: 10px; }
.scroll::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 3px solid transparent; background-clip: padding-box; }
kbd { font: 11.5px/1 var(--font); padding: 2px 5px; border: 1px solid var(--line-2); border-bottom-width: 2px; border-radius: 4px; background: var(--surface); color: var(--ink-2); }

input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface);
  border: 1px solid var(--line-2); border-radius: 7px; height: 32px; padding: 0 9px; outline: none; min-width: 0;
}
textarea { height: auto; padding: 7px 9px; resize: vertical; line-height: 1.45; }
select { padding-right: 4px; cursor: pointer; }
input[type="date"] { padding-right: 4px; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input::placeholder, textarea::placeholder { color: var(--ink-3); }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--line-2); background: var(--surface); border-radius: 7px; cursor: pointer; white-space: nowrap;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-ink); border-color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.danger:hover { background: var(--danger-weak); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--hover); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 13px; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .5; cursor: default; }
.icon {
  width: 32px; height: 32px; display: inline-grid; place-items: center; border-radius: 7px; border: 0;
  background: transparent; cursor: pointer; color: var(--ink-2); padding: 0; flex: none;
}
.icon:hover { background: var(--hover); color: var(--ink); }
.icon.sm { width: 26px; height: 26px; border-radius: 6px; }
.icon.on { color: var(--accent); }

/* ====== Layout ====== */
.app { display: grid; grid-template-rows: 50px minmax(0, 1fr); height: 100vh; }
.topbar { display: flex; align-items: center; gap: 8px; padding: 0 10px; background: var(--panel); border-bottom: 1px solid var(--line); min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; margin: 0 10px 0 4px; white-space: nowrap; }
.brand .logo { width: 24px; height: 24px; border-radius: 7px; background: var(--accent); color: #fff; display: grid; place-items: center; }
.brand .muted { font-weight: 500; }
.tabs { display: flex; gap: 2px; background: var(--hover); padding: 3px; border-radius: 9px; }
.tab { border: 0; background: transparent; padding: 0 12px; height: 30px; border-radius: 7px; cursor: pointer; color: var(--ink-2); display: flex; gap: 7px; align-items: center; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
.status { display: inline-flex; align-items: center; gap: 7px; height: 30px; padding: 0 10px; border-radius: 15px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 12.5px; color: var(--ink-2); white-space: nowrap; max-width: 340px; overflow: hidden; text-overflow: ellipsis; }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.status.pending .dot { background: var(--p2); }
.status.error { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 40%, var(--line)); background: var(--danger-weak); }
.status.error .dot, .status.warn .dot { background: var(--danger); }
.status.warn { color: var(--warn); background: var(--warn-weak); border-color: color-mix(in srgb, var(--warn) 30%, var(--line)); }

.layout { --lw: 300px; --rw: 360px; display: grid; grid-template-columns: var(--lw) minmax(0, 1fr) var(--rw); min-height: 0; }
.layout.no-left { --lw: 0px; }
.layout.no-right { --rw: 0px; }
.layout.no-left .panel.left, .layout.no-right .panel.right { display: none; }
/* placement explicite : masquer un volet ne doit pas décaler la liste dans une colonne vide */
.layout > .panel.left { grid-column: 1; grid-row: 1; }
.layout > .center { grid-column: 2; grid-row: 1; }
.layout > .panel.right { grid-column: 3; grid-row: 1; }
.panel { background: var(--panel); min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel.left { border-right: 1px solid var(--line); }
.panel.right { border-left: 1px solid var(--line); }
.phead { display: flex; align-items: center; gap: 8px; padding: 12px 12px 8px 16px; }
.phead h2 { font-size: 14px; display: flex; align-items: center; gap: 8px; flex: 1; }
.pbody { flex: 1; padding: 4px 12px 30px; }
.psearch { position: relative; padding: 0 12px 8px; }
.psearch input { width: 100%; padding-left: 30px; }
.psearch .ic { position: absolute; left: 22px; top: 8px; color: var(--ink-3); pointer-events: none; }
.center { min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.empty { text-align: center; color: var(--ink-3); padding: 28px 12px; font-size: 13.5px; }

/* ====== Quick add + filters ====== */
.qa { display: flex; gap: 8px; padding: 14px 16px 8px; flex-wrap: wrap; }
.qa { flex-wrap: nowrap; }
.qa #qaTitle { flex: 1 1 200px; height: 38px; font-size: 15px; }
.qa #qaCat { flex: 0 1 140px; height: 38px; }
.qa select { height: 38px; flex: 0 0 auto; width: 108px; }
.qa input[type="date"] { height: 38px; flex: 0 0 auto; width: 136px; }
.qa .btn { height: 38px; }
.filters { display: flex; gap: 8px; padding: 0 16px 8px; align-items: center; flex-wrap: wrap; }
.filters select { height: 30px; font-size: 13px; }
.search { position: relative; }
.search input { padding-left: 30px; height: 30px; width: 220px; font-size: 13px; }
.search .ic { position: absolute; left: 9px; top: 7px; color: var(--ink-3); pointer-events: none; }
.chips { display: flex; gap: 4px; }
.fchip { height: 30px; min-width: 32px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 12.5px; font-weight: 650; color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
.fchip i { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }
.fchip.on { background: var(--accent-weak); border-color: var(--accent); color: var(--accent-ink); }
.summary { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.hint { padding: 0 16px 6px; font-size: 12px; color: var(--ink-3); }

/* ====== Task list ====== */
.tasklist { flex: 1; padding: 0 16px 60px; }
.group { margin-top: 12px; }
.ghead { display: flex; align-items: center; gap: 8px; padding: 6px 4px 6px 2px; position: sticky; top: 0; background: var(--bg); z-index: 2; cursor: pointer; user-select: none; font-weight: 650; font-size: 13px; }
.ghead .gdot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.ghead .gcount { color: var(--ink-3); font-weight: 500; }
.ghead .gdesc { color: var(--ink-3); font-weight: 400; font-size: 12.5px; }
.ghead .add { margin-left: auto; opacity: 0; transition: opacity .1s; }
.ghead:hover .add, .ghead .add:focus-visible { opacity: 1; }
.caret { display: inline-flex; color: var(--ink-3); transition: transform .15s; transform: rotate(90deg); }
.collapsed > .ghead .caret, .mcard.collapsed .caret { transform: rotate(0deg); }
.collapsed > .gitems { display: none; }
.gitems { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.task { border-top: 1px solid var(--line); }
.task:first-child { border-top: 0; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; cursor: pointer; min-height: 40px; }
.row:hover { background: var(--hover); }
.task.open > .row { background: var(--accent-weak); }
.task.flash > .row { animation: flash 1.4s ease-out; }
@keyframes flash { 0%, 30% { background: color-mix(in srgb, var(--accent) 25%, transparent); } 100% { background: transparent; } }
.title { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.meta { display: flex; gap: 5px; align-items: center; flex-wrap: wrap; justify-content: flex-end; max-width: 50%; }
.rowact { opacity: 0; display: flex; }
.row:hover .rowact, .rowact:focus-within { opacity: 1; }
.prio { width: 20px; height: 20px; border-radius: 6px; display: inline-grid; place-items: center; font-size: 11px; font-weight: 750; color: #fff; flex: none; }
.prio.p1 { background: var(--p1); }
.prio.p2 { background: var(--p2); }
.prio.p3 { background: var(--p3); }
.prio.sm { width: 16px; height: 16px; font-size: 10px; border-radius: 5px; margin-top: 1px; }
.prio.p0 { background: transparent; color: var(--ink-3); border: 1px dashed var(--line-2); }
.chk { width: 19px; height: 19px; border-radius: 50%; border: 1.6px solid var(--line-2); background: var(--surface); flex: none; cursor: pointer; display: grid; place-items: center; padding: 0; color: transparent; transition: border-color .1s, background .1s; }
.chk:hover { border-color: var(--ok); color: var(--ok); background: var(--ok-weak); }
.chk.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.chk.sm { width: 16px; height: 16px; }
.chk .ic { width: 12px; height: 12px; }
.chk.sm .ic { width: 10px; height: 10px; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; background: var(--hover); color: var(--ink-2); white-space: nowrap; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.chip .ic { width: 12px; height: 12px; }
.chip.late { background: var(--danger-weak); color: var(--danger); }
.chip.soon { background: var(--warn-weak); color: var(--warn); }
.chip.meet { background: var(--meet-weak); color: var(--meet); }
.chip.prog { background: transparent; border: 1px solid var(--line); }
.chip.sm { height: 19px; font-size: 11.5px; padding: 0 6px; }
.ctag { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.ctag i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.subs { list-style: none; margin: 0; padding: 0 10px 6px 51px; }
.sub { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 13.5px; }
.sub .stxt { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.sub.done .stxt { text-decoration: line-through; color: var(--ink-3); }
.sub input.stitle { flex: 1; height: 28px; font-size: 13.5px; }
.sub input[type="date"] { height: 28px; font-size: 12.5px; width: 132px; }
.sub-add input { flex: 1; height: 28px; font-size: 13.5px; border-style: dashed; }
.editor { padding: 12px 14px 14px 51px; background: var(--panel); border-top: 1px dashed var(--line); }
.ed-grid { display: grid; grid-template-columns: minmax(0, 1fr) 180px 150px 150px; gap: 10px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--ink-3); font-weight: 550; }
.field > input, .field > select, .field > textarea { font-size: 14px; color: var(--ink); font-weight: 400; }
.ed-row { margin-top: 10px; }
.tagpick { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; }
.tagbtn { height: 26px; padding: 0 10px; border-radius: 13px; border: 1px solid var(--line-2); background: var(--surface); cursor: pointer; font-size: 12.5px; color: var(--ink-2); display: inline-flex; gap: 5px; align-items: center; }
.tagbtn.on { background: var(--meet-weak); border-color: var(--meet); color: var(--meet); }
.ed-foot { display: flex; gap: 8px; align-items: center; margin-top: 12px; }

/* ====== Édition sur place ====== */
.row { cursor: default; }
.title[contenteditable], .sub .stxt[contenteditable] { outline: none; border-radius: 5px; padding: 2px 5px; margin: -2px -5px; cursor: text; transition: background .1s, box-shadow .1s; }
.title[contenteditable]:hover, .sub .stxt[contenteditable]:hover { background: color-mix(in srgb, var(--ink) 5%, transparent); }
.title[contenteditable]:focus, .sub .stxt[contenteditable]:focus { background: var(--surface); box-shadow: 0 0 0 2px var(--accent); }
button.prio { border: 0; cursor: pointer; padding: 0; font: inherit; font-size: 11px; font-weight: 750; line-height: 1; }
button.prio:hover, button.prio:focus-visible { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--ink) 22%, transparent); }
.chip.click { border: 0; cursor: pointer; font: inherit; font-size: 12px; }
.chip.click:hover, .chip.click:focus-visible { outline: none; box-shadow: inset 0 0 0 1px color-mix(in srgb, currentColor 45%, transparent); }
.chip .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.ghost-btn { width: 24px; height: 24px; display: inline-grid; place-items: center; border: 0; background: transparent; border-radius: 6px; color: var(--ink-3); cursor: pointer; padding: 0; flex: none; }
.ghost-btn:hover, .ghost-btn:focus-visible { background: var(--hover); color: var(--ink); outline: none; }
.rowact { opacity: 0; display: inline-flex; }
.row:hover .rowact, .task.open .rowact, .rowact:focus-within { opacity: 1; }
.sub .ghost-btn { opacity: 0; }
.sub:hover .ghost-btn, .sub .ghost-btn:focus-visible { opacity: 1; }
.task.open { background: color-mix(in srgb, var(--accent) 4%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
.task.open > .row { background: transparent; }
.task.open > .row:hover { background: transparent; }
.tbody .desc { padding: 0 12px 2px 66px; }
.desc textarea { display: block; width: 100%; border: 1px solid transparent; background: transparent; resize: none; min-height: 30px; height: 30px; padding: 5px 6px; font-size: 13.5px; color: var(--ink-2); overflow: hidden; }
.desc textarea:hover { border-color: var(--line); }
.desc textarea:focus { background: var(--surface); color: var(--ink); }
.tbody .subs { padding: 0 10px 6px 67px; }
.sub-add .plus { width: 16px; display: grid; place-items: center; color: var(--ink-3); flex: none; }
.sub-add input { background: transparent; }
.tfoot { display: flex; align-items: center; gap: 10px; padding: 0 10px 8px 71px; font-size: 12px; color: var(--ink-3); }
.tfoot kbd { font-size: 10.5px; padding: 1px 4px; }
.menu { display: flex; flex-direction: column; gap: 1px; }
.mi { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: transparent; padding: 6px 8px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13.5px; color: var(--ink); }
.mi:hover, .mi:focus-visible { background: var(--hover); outline: none; }
.mi.on { background: var(--accent-weak); }
.mi .ml { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mi small { color: var(--ink-3); font-size: 11.5px; white-space: nowrap; }
.mi kbd { font-size: 10.5px; }
.mi .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.mi .cb { width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex: none; }
.mi.on .cb { background: var(--meet); border-color: var(--meet); color: #fff; }
.mi .prio { width: 18px; height: 18px; }
.popover .quick { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 8px; }
.popover .quick .btn.on { border-color: var(--accent); color: var(--accent-ink); background: var(--accent-weak); }
.popover #popCat { width: 100%; }

/* ====== Meetings ====== */
.mcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
.mcard.past { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); }
.mhead { display: flex; gap: 8px; align-items: flex-start; padding: 9px 8px 9px 10px; cursor: pointer; }
.mhead:hover { background: var(--hover); }
.mhead .caret { margin-top: 2px; }
.minfo { flex: 1; min-width: 0; }
.mtitle { font-weight: 650; overflow-wrap: anywhere; }
.mdate { font-size: 12.5px; color: var(--ink-3); margin-top: 1px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mdate .badge { font-size: 11px; font-weight: 650; padding: 1px 6px; border-radius: 8px; background: var(--warn-weak); color: var(--warn); }
.mdate .badge.soon { background: var(--accent-weak); color: var(--accent-ink); }
.mcount { min-width: 22px; height: 22px; border-radius: 11px; background: var(--meet-weak); color: var(--meet); font-size: 12px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.mcard.collapsed .subjects, .mcard.collapsed .mfoot { display: none; }
.subjects { list-style: none; margin: 0; padding: 0 10px 4px 12px; }
.subject { display: flex; gap: 8px; align-items: flex-start; padding: 5px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.subject .chk { margin-top: 1px; }
.subject .stxt { flex: 1; min-width: 0; cursor: pointer; overflow-wrap: anywhere; }
.subject .stxt:hover { color: var(--accent-ink); text-decoration: underline; text-decoration-color: color-mix(in srgb, var(--accent) 50%, transparent); }
.subject .ctag { margin-top: 2px; }
.subject-add { padding: 6px 0 4px; border-top: 1px solid var(--line); }
.subject-add input { width: 100%; height: 28px; font-size: 13px; border-style: dashed; }
.mfoot { padding: 4px 10px 10px; }
.mform { background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; padding: 10px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 8px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 12%, transparent); }
.mform .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.mform .btns { display: flex; gap: 6px; }

/* ====== History ====== */
.wsep { display: flex; align-items: baseline; gap: 8px; margin: 18px 4px 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; }
.wsep span { font-weight: 500; text-transform: none; letter-spacing: 0; color: var(--ink-3); }
.wsep b { margin-left: auto; font-weight: 600; color: var(--ink-3); letter-spacing: 0; }
.wsep:first-child { margin-top: 6px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; overflow: hidden; }
.dhead { display: flex; justify-content: space-between; padding: 7px 10px; font-weight: 650; font-size: 13px; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--panel) 60%, var(--surface)); }
.dhead .dcount { color: var(--ink-3); font-weight: 500; }
.dhead.today { color: var(--accent-ink); }
.hrow { display: flex; gap: 8px; padding: 6px 6px 6px 10px; align-items: flex-start; border-top: 1px solid var(--line); }
.hrow:first-of-type { border-top: 0; }
.hrow:hover { background: var(--hover); }
.hdot { width: 8px; height: 8px; border-radius: 2px; flex: none; margin-top: 6px; }
.hcat { font-size: 11.5px; font-weight: 600; color: var(--ink-3); white-space: nowrap; margin-left: 2px; }
.htext { flex: 1; min-width: 0; font-size: 13.5px; overflow-wrap: anywhere; }
.hsub { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; font-size: 12px; color: var(--ink-3); align-items: center; }
.hrow .hedit { opacity: 0; }
.hrow:hover .hedit, .hedit:focus-visible { opacity: 1; }
.hform { padding: 10px; display: flex; flex-direction: column; gap: 7px; background: var(--panel); border-top: 1px solid var(--line); }
.hform .row2 { display: grid; grid-template-columns: 1fr 140px; gap: 7px; }
.hform .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.hadd { background: var(--surface); border: 1px solid var(--accent); border-radius: 10px; margin: 4px 0 10px; padding: 10px; display: flex; flex-direction: column; gap: 7px; }
.hadd .row2 { display: grid; grid-template-columns: 1fr 140px; gap: 7px; }
.more { display: block; width: 100%; margin-top: 6px; }

/* ====== Stats ====== */
.stats-controls { display: flex; gap: 10px; align-items: center; padding: 14px 20px 6px; flex-wrap: wrap; }
.stats-controls label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--ink-2); }
.seg { display: inline-flex; background: var(--hover); padding: 3px; border-radius: 8px; gap: 2px; }
.seg button { border: 0; background: transparent; height: 26px; padding: 0 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.1); }
#statsBody { padding: 6px 20px 40px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.tile .tl { font-size: 12.5px; color: var(--ink-2); }
.tile .tv { font-size: 26px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }
.tile .ts { font-size: 12px; color: var(--ink-3); }
.tile .crit { display: inline-flex; align-items: center; gap: 5px; color: var(--danger); font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
.card h3 { font-size: 14px; }
.card .sub-h { font-size: 12.5px; color: var(--ink-3); margin: 2px 0 10px; }
.chart-row { display: grid; grid-template-columns: minmax(240px, 300px) minmax(0, 1fr); gap: 20px; align-items: center; }
.legend { display: flex; flex-direction: column; gap: 2px; }
.lg { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto 48px; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 6px; font-size: 13px; cursor: default; }
.lg:hover { background: var(--hover); }
.lg i { width: 12px; height: 12px; border-radius: 3px; }
.lg .n { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.lg .p { font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; }
.lg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lg-inline { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-2); }
.lg-inline span { display: inline-flex; align-items: center; gap: 6px; }
.lg-inline i { width: 10px; height: 10px; border-radius: 3px; }
svg .mk { transition: opacity .12s; }
svg.hl .mk { opacity: .22; }
svg.hl .mk.on { opacity: 1; }
.axis-t { font-size: 11px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.ranks { display: grid; grid-template-columns: minmax(120px, 220px) minmax(0, 1fr) 44px 44px; gap: 4px 10px; align-items: center; font-size: 13px; }
.ranks .rb { height: 8px; border-radius: 0 4px 4px 0; }
.ranks .rn { text-align: right; font-weight: 600; font-variant-numeric: tabular-nums; }
.ranks .rp { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.ranks .rl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.ranks .rl i { width: 8px; height: 8px; border-radius: 2px; flex: none; }
.tooltip { position: fixed; z-index: 60; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 150px; max-width: 280px; }
.tooltip .tt-h { font-weight: 650; margin-bottom: 4px; }
.tooltip .tt-r { display: grid; grid-template-columns: 10px 1fr auto; gap: 6px; align-items: center; }
.tooltip .tt-r i { width: 9px; height: 9px; border-radius: 2px; }
.tooltip .tt-r b { font-variant-numeric: tabular-nums; }

/* ====== AI ====== */
.ai-top { display: flex; gap: 10px; align-items: center; padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); flex-wrap: wrap; }
.ai-top b { color: var(--ink); }
.ai-msgs { flex: 1; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
.msg { max-width: 860px; width: 100%; margin: 0 auto; }
.msg.user { display: flex; justify-content: flex-end; }
.msg.user .bubble { background: var(--accent); color: #fff; padding: 9px 13px; border-radius: 14px 14px 4px 14px; max-width: 75%; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.assistant .md { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px; overflow-wrap: anywhere; }
.msg.error .md { background: var(--danger-weak); color: var(--danger); border-radius: 12px; padding: 10px 14px; }
.msg .mmeta { font-size: 11.5px; color: var(--ink-3); margin-top: 4px; padding-left: 4px; }
.md p { margin: 0 0 8px; }
.md p:last-child { margin-bottom: 0; }
.md ul, .md ol { margin: 4px 0 8px; padding-left: 22px; }
.md li { margin: 2px 0; }
.md h3, .md h4, .md h5 { font-size: 14.5px; margin: 10px 0 6px; }
.md code { font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--hover); padding: 1px 4px; border-radius: 4px; }
.md table { border-collapse: collapse; margin: 6px 0 10px; font-size: 13px; }
.md th, .md td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
.md th { background: var(--panel); }
.ai-form { display: flex; gap: 8px; padding: 12px 20px 16px; border-top: 1px solid var(--line); background: var(--panel); }
.ai-form textarea { flex: 1; resize: none; max-height: 200px; min-height: 42px; }
.ai-form .btn { height: 42px; }
.suggest { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
.suggest button { border: 1px solid var(--line-2); background: var(--surface); border-radius: 16px; padding: 6px 12px; cursor: pointer; font-size: 13px; color: var(--ink-2); }
.suggest button:hover { border-color: var(--accent); color: var(--accent-ink); }
.ai-empty { text-align: center; color: var(--ink-2); max-width: 640px; margin: 30px auto 0; }
.ai-empty h3 { font-size: 17px; margin-bottom: 6px; color: var(--ink); }
.typing { display: inline-flex; gap: 4px; padding: 12px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; }
.typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

/* ====== Popover / modal / toast / gate ====== */
.popover { position: fixed; z-index: 50; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); border-radius: 10px; padding: 10px; width: 260px; }
.popover .ph { font-size: 12.5px; font-weight: 650; color: var(--ink-2); margin-bottom: 8px; }
.popover .pq { display: flex; gap: 6px; margin-bottom: 8px; }
.popover .pq .btn { flex: 1; }
.popover .pr { display: flex; gap: 6px; }
.popover .pr input { flex: 1; }
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(10, 10, 10, .38); display: grid; place-items: center; padding: 20px; }
.modal-card { background: var(--surface); border-radius: 14px; box-shadow: var(--shadow); width: min(760px, 100%); max-height: calc(100vh - 40px); overflow: auto; }
.modal-card.narrow { width: min(460px, 100%); }
.mh { display: flex; align-items: center; padding: 16px 20px 8px; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.mh h2 { flex: 1; font-size: 17px; }
.mbody { padding: 4px 20px 20px; }
.mbody section { padding: 14px 0; border-top: 1px solid var(--line); }
.mbody section:first-child { border-top: 0; }
.mbody h3 { font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.mbody .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
.mbody .note { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
.mbody .btns { display: flex; flex-wrap: wrap; gap: 8px; }
.radio { display: inline-flex; gap: 14px; }
.radio label, .check { display: inline-flex; gap: 7px; align-items: center; font-size: 14px; color: var(--ink); cursor: pointer; }
.check input, .radio input { height: auto; width: 16px; height: 16px; accent-color: var(--accent); }
.cat-table { display: grid; grid-template-columns: 22px 150px minmax(0, 1fr) minmax(0, 1.3fr) 44px 30px; gap: 6px 8px; align-items: center; font-size: 13px; }
.cat-table .hd { font-size: 11.5px; color: var(--ink-3); font-weight: 600; }
.cat-table input, .cat-table select { height: 28px; font-size: 13px; }
.cat-table .sw { width: 14px; height: 14px; border-radius: 4px; }
.cat-table .cnt { text-align: right; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.confirm-body { padding: 20px; white-space: pre-line; }
.confirm-btns { display: flex; gap: 8px; justify-content: flex-end; padding: 0 20px 18px; flex-wrap: wrap; }
.toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); z-index: 70; display: flex; flex-direction: column; gap: 8px; align-items: center; }
.toast { background: var(--toast, #222220); color: #f3f2ee; padding: 9px 10px 9px 14px; border-radius: 10px; box-shadow: var(--shadow); display: flex; gap: 12px; align-items: center; font-size: 13.5px; animation: tin .18s ease-out; }
.toast button { background: transparent; border: 0; color: #8fc0f7; font-weight: 650; cursor: pointer; padding: 4px 6px; border-radius: 6px; }
.toast button:hover { background: rgba(255,255,255,.1); }
@keyframes tin { from { transform: translateY(8px); opacity: 0; } }
.gate { position: fixed; inset: 0; z-index: 80; background: var(--bg); display: grid; place-items: center; padding: 20px; overflow-y: auto; }
.gate-card .g2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.gate-card .field input { width: 100%; min-width: 0; box-sizing: border-box; }
@media (max-width: 560px) { .gate { padding: 10px; } .gate-card { padding: 22px 16px; } }
.gate-card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 30px; width: min(520px, 100%); text-align: center; }
.gate-card .logo { width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: #fff; display: grid; place-items: center; margin: 0 auto 14px; }
.gate-card h1 { font-size: 20px; margin-bottom: 8px; }
.gate-card p { color: var(--ink-2); margin: 0 0 18px; }
.gate-card .gbtns { display: flex; flex-direction: column; gap: 8px; }
.gate-card .gbtns .btn { height: 40px; }
.gate-card .small { margin-top: 16px; color: var(--ink-3); }

/* ====== Responsive ====== */
@media (max-width: 1180px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  .layout > .center { grid-column: 1; }
  .panel { position: fixed; top: 50px; bottom: 0; width: min(360px, 92vw); z-index: 30; box-shadow: var(--shadow); }
  .panel.left { left: 0; }
  .panel.right { right: 0; }
  .ed-grid { grid-template-columns: 1fr 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .chart-row { grid-template-columns: 1fr; }
}
@media (max-width: 980px) {
  .qa { flex-wrap: wrap; }
  .qa .btn .lbl { display: none; }
}
@media (max-width: 760px) {
  .hide-sm { display: none; }
  .brand .muted, .tab .lbl, .status .lbl { display: none; }
  .search input { width: 150px; }
  .ranks { grid-template-columns: minmax(90px, 140px) minmax(0, 1fr) 36px 40px; }
  .cat-table { grid-template-columns: 22px 110px minmax(0, 1fr) 36px 30px; }
  .cat-table .desc { display: none; }
}
@media (forced-colors: active) {
  .chk.done, .prio { forced-color-adjust: none; }
}


/* ====== Refonte visuelle ====== */
body { font-feature-settings: "cv11", "ss01"; letter-spacing: -0.003em; }
.topbar { background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(8px); box-shadow: 0 1px 0 var(--line); border-bottom: 0; }
.brand { font-weight: 700; letter-spacing: -0.01em; }
.brand .logo { width: 28px; height: 28px; border-radius: 9px; background: linear-gradient(135deg, #3a8ef0, #6a5ae0); box-shadow: 0 2px 6px rgba(70, 90, 220, .35); }
.tabs { background: var(--hover); border-radius: 11px; padding: 3px; }
.tab { border-radius: 8px; font-weight: 550; }
.tab.on { box-shadow: 0 1px 3px rgba(20, 30, 60, .12); color: var(--accent-ink); }
.panel { background: var(--panel); }
.phead h2 { font-size: 14.5px; letter-spacing: -0.01em; }
.phead h2 .ic { color: var(--accent); }
input, select, textarea { border-radius: 9px; transition: border-color .12s, box-shadow .12s; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 16%, transparent); }
.btn.primary { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #fff), var(--accent)); box-shadow: 0 1px 2px rgba(20, 60, 140, .25), inset 0 1px 0 rgba(255,255,255,.2); }

/* tableau de bord */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 14px 16px 2px; }
.kpi { position: relative; display: grid; grid-template-columns: auto 1fr; grid-template-rows: auto auto; column-gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; overflow: hidden; transition: transform .12s, box-shadow .12s, border-color .12s; --kc: var(--accent); }
.kpi::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--kc); }
.kpi:hover { transform: translateY(-1px); box-shadow: var(--shadow); }
.kpi.on { border-color: var(--kc); background: color-mix(in srgb, var(--kc) 9%, var(--surface)); box-shadow: 0 0 0 2px color-mix(in srgb, var(--kc) 25%, transparent); }
.kpi .kn { grid-row: span 2; font-size: 26px; font-weight: 750; letter-spacing: -0.03em; color: var(--kc); font-variant-numeric: tabular-nums; min-width: 34px; }
.kpi .kl { font-weight: 650; font-size: 13px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .ks { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.k-p1 { --kc: var(--p1); }
.kpi.k-late { --kc: #e0702c; }
.kpi.k-week { --kc: var(--accent); }
.kpi.k-done { --kc: var(--ok); }
.kpi .spark { grid-column: 2; width: 100%; max-width: 160px; height: 18px; display: block; margin-top: 2px; }
.kpi .spark rect { fill: color-mix(in srgb, var(--ok) 55%, transparent); }
.kpi .spark rect.cur { fill: var(--ok); }
.kpi .spark rect.zero { fill: var(--line); }

.qa { padding-top: 12px; }
.qa #qaTitle { border-radius: 10px; }

/* groupes = cartes avec bandeau de couleur */
.tasklist { padding-top: 2px; }
.group { margin-top: 16px; --gc: var(--line-2); }
.ghead { background: var(--bg); padding: 6px 4px 7px 2px; font-size: 13.5px; }
.ghead .gdot { width: 11px; height: 11px; border-radius: 4px; box-shadow: 0 0 0 3px color-mix(in srgb, var(--gc) 20%, transparent); }
.ghead .glabel { letter-spacing: -0.01em; }
.ghead .gcount { min-width: 22px; height: 20px; padding: 0 7px; border-radius: 10px; background: var(--hover); font-size: 11.5px; font-weight: 650; display: inline-grid; place-items: center; color: var(--ink-2); }
.gbadge { font-size: 11.5px; font-weight: 600; padding: 2px 8px; border-radius: 10px; }
.gbadge.p1 { background: color-mix(in srgb, var(--p1) 12%, var(--surface)); color: var(--p1); }
.gbadge.late { background: color-mix(in srgb, #e0702c 13%, var(--surface)); color: #c45a18; }
.gitems { border-radius: 12px; border: 1px solid var(--line); border-top: 3px solid var(--gc); box-shadow: 0 1px 2px rgba(20, 30, 60, .04); }

/* lignes de tâches */
.task { position: relative; transition: background .12s; }
.task::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: transparent; }
.task.pr1::before { background: var(--p1); }
.task.pr2::before { background: color-mix(in srgb, var(--p2) 70%, transparent); }
.task.open::before { display: none; }
.row { min-height: 44px; padding-left: 14px; }
.row .title { font-weight: 500; }
.task.pr3 .row .title { color: var(--ink-2); }
.prio { width: 22px; height: 22px; border-radius: 7px; box-shadow: inset 0 -1px 0 rgba(0,0,0,.15); }
.chk { transition: border-color .12s, background .12s, transform .12s; }
.chk:hover { transform: scale(1.08); }
.chip { height: 23px; border-radius: 12px; font-weight: 500; }
.chip.late { font-weight: 650; }
.task.open { box-shadow: inset 3px 0 0 var(--accent), 0 6px 18px rgba(20, 30, 60, .08); }

/* réunions */
.mcard { border-radius: 12px; border: 1px solid var(--line); border-left: 4px solid var(--meet); box-shadow: 0 1px 2px rgba(20, 30, 60, .04); }
.mcard.past { border-left-color: var(--warn); }
.mtitle { letter-spacing: -0.01em; }
.mcount { background: var(--meet); color: #fff; }

/* historique : frise */
.day { border-radius: 12px; }
.dhead { background: transparent; }
.dhead.today { background: var(--accent-weak); }
.hrow { position: relative; padding-left: 24px; border-top: 0; }
.hrow::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.hrow:first-of-type::before { top: 10px; }
.hrow:last-child::before { bottom: calc(100% - 12px); }
.hrow .hdot { position: absolute; left: 9px; top: 9px; width: 10px; height: 10px; margin: 0; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); z-index: 1; }
.wsep { color: var(--accent-ink); }

@media (max-width: 1180px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .kpi .kn { font-size: 21px; } .kpis { gap: 8px; padding: 10px 10px 0; } }

/* ====== Refonte 2 : moins de bruit, plus de hiérarchie ====== */
/* colonne centrale : largeur de lecture limitée et centrée sur grand écran */
#view-tasks { --cpad: max(16px, calc((100% - 940px) / 2)); }
#view-tasks > .kpis, #view-tasks > .qa, #view-tasks > .qa-preview, #view-tasks > .filters { padding-left: var(--cpad); padding-right: var(--cpad); }
#view-tasks > .tasklist { padding-left: var(--cpad); padding-right: var(--cpad); }
.layout { --lw: 284px; --rw: 330px; }

/* indicateurs : une ligne de pastilles compactes et cliquables */
.kpis { display: flex; gap: 8px; padding-top: 14px; padding-bottom: 0; flex-wrap: wrap; }
.kpi { display: inline-flex; align-items: center; gap: 8px; padding: 0 12px 0 10px; height: 34px; border-radius: 17px; flex: 0 0 auto; box-shadow: none; }
.kpi::before { display: none; }
.kpi:hover { transform: none; box-shadow: none; border-color: var(--kc); }
.kpi .kn { grid-row: auto; font-size: 15px; font-weight: 750; min-width: 0; letter-spacing: -0.01em; }
.kpi .kl { font-weight: 550; font-size: 13px; color: var(--ink-2); }
.kpi .ks { display: none; }
.kpi .spark { width: 54px; height: 16px; margin: 0; }
.kpi.k-p1 { --kc: var(--ink-2); }
.kpi.k-p1 .kn { color: var(--ink); }

/* saisie rapide : un seul champ, options à la demande, aperçu de ce qui est compris */
.qa { padding-top: 12px; padding-bottom: 6px; align-items: center; }
.qa #qaTitle { height: 40px; font-size: 15px; padding: 0 12px; box-shadow: 0 1px 2px rgba(20, 30, 60, .05); }
.qa .btn { height: 40px; }
.qa-extra { display: contents; }
.qa-extra[hidden] { display: none !important; }
.qa .qa-opt { width: 40px; height: 40px; border: 1px solid var(--line-2); background: var(--surface); border-radius: 9px; }
.qa .qa-opt.on { color: var(--accent); border-color: var(--accent); background: var(--accent-weak); }
.qa-preview { display: none; gap: 6px; align-items: center; flex-wrap: wrap; padding-bottom: 6px; font-size: 12px; color: var(--ink-3); }
.qa-preview.on { display: flex; }
.qa-preview .qp-l { margin-right: 2px; }
.qa-preview em { font-style: normal; color: var(--ink-3); }

/* filtres : une ligne, menus déroulants discrets */
.filters { gap: 6px; padding-top: 2px; padding-bottom: 10px; flex-wrap: wrap; }
.search input { width: 200px; }
.fsep { width: 1px; height: 18px; background: var(--line-2); margin: 0 2px; }
.fsel { height: 30px; border-color: transparent; background-color: transparent; color: var(--ink-2); font-size: 13px; font-weight: 550; padding: 0 4px 0 8px; border-radius: 8px; max-width: 190px; }
.fsel:hover { background-color: var(--hover); }
.fsel:focus { background-color: var(--surface); }
.fchip { height: 28px; min-width: 30px; border-color: var(--line); }
.summary { margin-right: 2px; }
.filters .icon.on { color: var(--accent); background: var(--accent-weak); }

/* groupes : en-têtes de section collants, sans cartes colorées */
.group { margin-top: 18px; }
.group:first-child { margin-top: 4px; }
.ghead { font-size: 14.5px; font-weight: 700; padding: 8px 4px 8px 2px; gap: 9px; box-shadow: 0 1px 0 var(--bg); }
.ghead .gdot { width: 10px; height: 10px; border-radius: 3px; box-shadow: none; }
.ghead .gcount { background: transparent; color: var(--ink-3); font-weight: 600; padding: 0 2px; min-width: 0; }
.ghead .gdesc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.gitems { border-top: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(20, 30, 60, .03); }

/* tâches : un seul signal de priorité, sobre */
.task::before { display: none; }
.row { min-height: 42px; padding: 5px 8px 5px 12px; gap: 10px; }
.row .title { font-weight: 450; line-height: 1.4; }
.task.pr1 .row .title { font-weight: 550; }
.task.pr3 .row .title, .task.pr0 .row .title { color: var(--ink-2); }
.prio { width: 20px; height: 20px; border-radius: 6px; box-shadow: none; font-size: 11px; }
.prio.p1 { background: color-mix(in srgb, var(--p1) 14%, var(--surface)); color: var(--p1); }
.prio.p2 { background: color-mix(in srgb, var(--p2) 16%, var(--surface)); color: color-mix(in srgb, var(--p2) 80%, var(--ink)); }
.prio.p3 { background: var(--hover); color: var(--ink-3); }
.prio.p0 { border-color: var(--line); }
.prio.sm { width: 16px; height: 16px; font-size: 10px; }
.task:not(.open) .row .title:not(:focus) { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.chip { height: 22px; font-size: 12px; }
.chip.prog { gap: 6px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chip.prog .pbar { width: 26px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; display: inline-block; }
.chip.prog .pbar i { display: block; height: 100%; background: var(--ok); border-radius: 2px; }
.chip.prog.full { color: var(--ok); }
.subs, .tbody .subs { padding: 0 12px 8px 72px; }
.sub { min-height: 28px; font-size: 13px; color: var(--ink-2); }
.task:not(.open) .sub .stxt:not(:focus) { display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }
.task.open { box-shadow: inset 3px 0 0 var(--accent), 0 4px 16px rgba(20, 30, 60, .07); }

/* réunions : cartes plus légères, sujets coupés à 2 lignes */
.mcard { border-left-width: 3px; margin-bottom: 8px; }
.mhead { align-items: center; padding: 8px 8px 8px 10px; }
.mcard.collapsed .mhead { padding-top: 7px; padding-bottom: 7px; }
.mcount { min-width: 22px; height: 20px; font-size: 11.5px; }
.subject { font-size: 13px; padding: 5px 0; }
.subject .stxt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* historique : sous-tâches d'un même parent regroupées */
.hrow { padding-top: 5px; padding-bottom: 5px; }
.htext { font-size: 13px; }
.hgroup { position: relative; }
.hghead { position: relative; display: flex; gap: 8px; align-items: flex-start; padding: 6px 8px 3px 24px; }
.hghead::before { content: ""; position: absolute; left: 13px; top: 0; bottom: 0; width: 2px; background: var(--line); }
.hgroup:first-of-type .hghead::before { top: 10px; }
.hghead .hdot { position: absolute; left: 9px; top: 10px; width: 10px; height: 10px; margin: 0; border-radius: 50%; box-shadow: 0 0 0 2px var(--surface); z-index: 1; }
.hghead .hgt { font-weight: 600; }
.hgn { font-size: 11px; font-weight: 700; color: var(--ink-3); background: var(--hover); border-radius: 9px; padding: 1px 7px; margin-top: 1px; }
.hrow.insub { padding-left: 40px; padding-top: 2px; padding-bottom: 2px; }
.hrow.insub .htext { color: var(--ink-2); font-size: 12.5px; }
.hrow.insub .hdot { left: 11px; top: 8px; width: 6px; height: 6px; box-shadow: none; opacity: .6; }
.hgroup .hrow.insub:last-child::before { bottom: 0; }
.day > .hgroup:last-child .hrow.insub:last-child::before { bottom: calc(100% - 12px); }

/* statistiques : barres horizontales triées */
.legend.bars { gap: 1px; }
.lg.lgbar { grid-template-columns: minmax(130px, 260px) minmax(0, 1fr) 44px 46px; gap: 12px; padding: 5px 8px; }
.lg.lgbar .nm { display: flex; align-items: center; gap: 8px; }
.lg.lgbar .nm i { width: 10px; height: 10px; flex: none; }
.lg.lgbar .bt { height: 10px; border-radius: 5px; background: color-mix(in srgb, var(--line) 60%, transparent); overflow: hidden; }
.lg.lgbar .bf { display: block; height: 100%; border-radius: 5px; min-width: 3px; }

#fCat { max-width: 150px; } #fMeet, #fGroup { max-width: 132px; }
.filters { flex-wrap: nowrap; }
.filters .fsel { flex: none; text-overflow: ellipsis; }
.filters .search { flex: 0 1 200px; min-width: 96px; }
.filters .search input { width: 100%; }
.filters .chips, .filters .icon, .filters .fsep { flex: none; }
.search input { width: 170px; }
.summary { font-weight: 600; color: var(--accent-ink); }
.hghead .hgt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hghead .htext { min-width: 0; }
.lg.lgbar { grid-template-columns: minmax(130px, 300px) minmax(0, 1fr) 44px 46px; }
.lg.lgbar .nm { overflow: hidden; white-space: nowrap; }

/* couleurs automatiques + fond des groupes teinté de la couleur de la catégorie */
:root { --tint: 6%; --a0: #1597b5; --a1: #9a4fc0; --a2: #7d8a1c; --a3: #9a5b2e; --a4: #4f68b8; --a5: #c2378a; --a6: #2a7d6b; --a7: #b8860b; --a8: #8b7cf0; --a9: #c4532d; --a10: #4aa8e8; --a11: #5ea83a; }
:root[data-theme="dark"] { --tint: 9%; --a0: #3bb6d3; --a1: #b77ddb; --a2: #a3b23a; --a3: #c4875a; --a4: #7f96dc; --a5: #e066ad; --a6: #4fae97; --a7: #d9a93a; --a8: #a89cf5; --a9: #e07a55; --a10: #74c0f0; --a11: #84c763; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tint: 9%; --a0: #3bb6d3; --a1: #b77ddb; --a2: #a3b23a; --a3: #c4875a; --a4: #7f96dc; --a5: #e066ad; --a6: #4fae97; --a7: #d9a93a; --a8: #a89cf5; --a9: #e07a55; --a10: #74c0f0; --a11: #84c763; } }
.gitems { background: color-mix(in srgb, var(--gc) var(--tint), var(--surface)); border-color: color-mix(in srgb, var(--gc) 22%, var(--line)); }
.gitems .task { border-top-color: color-mix(in srgb, var(--gc) 14%, var(--line)); }
.gitems .row:hover { background: color-mix(in srgb, var(--gc) calc(var(--tint) + 6%), var(--surface)); }
.gitems .task.open { background: color-mix(in srgb, var(--gc) 3%, var(--surface)); }
.task:not(.open) .sub .stxt:not(:focus) { -webkit-line-clamp: 2; }
.group.collapsed { margin-top: 2px; }
.group.collapsed + .group:not(.collapsed) { margin-top: 14px; }

.sub.more { min-height: 22px; }
.linkbtn { border: 0; background: none; padding: 0; font: inherit; font-size: 12.5px; color: var(--ink-3); cursor: pointer; }
.linkbtn:hover { color: var(--accent-ink); text-decoration: underline; }

/* objectif P1 et incitation aux échéances */
.kpi.k-p1 .kl { font-weight: 650; color: var(--ink); }
.kpi .kgoal { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-left: -4px; }
.kpi.k-p1.over { --kc: var(--warn); background: var(--warn-weak); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); }
.kpi.k-p1.over .kn { color: var(--warn); }
.kpi.k-p1.ok { --kc: var(--ok); }
.kpi.k-p1.ok .kn { color: var(--ok); }
.kpi .kmeter { width: 46px; height: 5px; border-radius: 3px; background: color-mix(in srgb, var(--warn) 25%, transparent); overflow: hidden; display: inline-block; }
.kpi .kmeter i { display: block; height: 100%; background: var(--ok); }
.kpi.k-nodue { --kc: var(--accent); }
.chip.nodate { background: transparent; border: 1px dashed color-mix(in srgb, var(--warn) 55%, var(--line-2)); color: var(--warn); font-weight: 550; }
.chip.nodate.click:hover { background: var(--warn-weak); }
.nudge { display: flex; gap: 10px; align-items: flex-start; margin: 6px 0 4px; padding: 10px 12px; border-radius: 10px; background: var(--accent-weak); color: var(--ink-2); font-size: 13px; line-height: 1.5; border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); }
.nudge .ic { margin-top: 2px; color: var(--accent); }
.nudge.warn { background: var(--warn-weak); border-color: color-mix(in srgb, var(--warn) 30%, transparent); }
.nudge.warn .ic { color: var(--warn); }
.nudge b { color: var(--ink); }
.nudge .chip, .nudge .prio { vertical-align: middle; }
.qa-preview .qp-warn { display: inline-flex; align-items: center; gap: 4px; color: var(--warn); font-weight: 550; }
.qa-preview .qp-warn .ic { width: 12px; height: 12px; }

/* téléphone / petite fenêtre */
@media (max-width: 760px) {
  #view-tasks { --cpad: 12px; }
  .brand { margin-right: 2px; }
  .brand > :not(.logo) { display: none; }
  .brand { font-size: 0; }
  .topbar { gap: 4px; padding: 0 6px; }
  .status { padding: 0 9px; }
  .kpis { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-top: 10px; }
  .kpis::-webkit-scrollbar { display: none; }
  .qa { flex-wrap: nowrap; }
  .qa .btn .lbl { display: none; }
  .qa-extra:not([hidden]) { display: flex !important; flex-wrap: wrap; gap: 6px; width: 100%; order: 5; }
  .qa:has(.qa-extra:not([hidden])) { flex-wrap: wrap; }
  .qa-extra input, .qa-extra select { flex: 1 1 120px; height: 36px; }
  .filters { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .filters::-webkit-scrollbar { display: none; }
  .filters > * { flex: none; }
  .search input { width: 150px; }
  .summary { display: none; }
  .row { display: grid; grid-template-columns: auto auto minmax(0, 1fr); column-gap: 8px; row-gap: 3px; padding-left: 8px; }
  .meta { grid-column: 3; max-width: none; justify-content: flex-start; }
  .meta:empty, .meta:not(:has(> :not(.rowact))) { display: none; }
  .task.open .meta { display: flex; }
  .task:not(.open) .rowact { display: none; }
  .subs, .tbody .subs { padding-left: 44px; }
  .tbody .desc { padding-left: 44px; }
  .tfoot { padding-left: 44px; }
  .lg.lgbar { grid-template-columns: minmax(90px, 130px) minmax(0, 1fr) 32px 40px; gap: 8px; }
}

/* ====== Mobile (refonte tactile) ====== */
.bnav, .fmore { display: none; }
@media (max-width: 760px) {
  :root { --bnh: calc(60px + env(safe-area-inset-bottom)); }
  body { font-size: 16px; }
  .app { height: 100dvh; grid-template-rows: calc(54px + env(safe-area-inset-top)) minmax(0, 1fr) var(--bnh); }
  input, select, textarea { font-size: 16px !important; }

  /* barre du haut : logo, état, annuler, réglages */
  .topbar { padding: env(safe-area-inset-top) 10px 0; gap: 6px; }
  .topbar .tabs, .topbar [data-act="toggle-left"], .topbar [data-act="toggle-right"], .topbar [data-act="theme"] { display: none; }
  .brand { font-size: 17px; margin-left: 2px; }
  .brand > :not(.logo) { display: inline; }
  .brand .muted { display: none; }
  .brand .logo { width: 30px; height: 30px; border-radius: 9px; }
  .topbar .icon { width: 42px; height: 42px; }
  .status { height: 34px; padding: 0 12px; }

  /* barre de navigation du bas */
  .bnav { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--panel); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); z-index: 35; }
  .bnav button { border: 0; background: transparent; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
  .bnav button .ic { width: 23px; height: 23px; }
  .bnav button.on { color: var(--accent); }
  .bnav button.on .ic { background: var(--accent-weak); border-radius: 12px; padding: 3px 14px; box-sizing: content-box; }

  /* volets Réunions / Historique en plein écran */
  .panel { position: fixed !important; top: calc(54px + env(safe-area-inset-top)) !important; bottom: var(--bnh) !important; left: 0 !important; right: 0 !important; width: auto !important; border: 0 !important; box-shadow: none !important; z-index: 30; }
  .phead { padding: 14px 14px 10px 16px; }
  .phead h2 { font-size: 18px; }
  .phead .btn.sm { height: 38px; font-size: 15px; padding: 0 14px; }
  .pbody { padding: 4px 12px 30px; }
  .psearch input { height: 42px; }
  .psearch .ic { top: 13px; }

  /* compteurs */
  .kpis { padding: 10px 12px 2px !important; gap: 8px; }
  .kpi { height: 38px; border-radius: 19px; }
  .kpi .kn { font-size: 17px; }
  .kpi .kl { font-size: 14px; }

  /* ajout rapide */
  .qa { padding: 10px 12px 6px; gap: 8px; }
  .qa #qaTitle { height: 46px; border-radius: 10px; }
  .qa .btn, .qa .icon { height: 46px; min-width: 46px; border-radius: 10px; }
  .qa-extra input, .qa-extra select { height: 44px !important; }

  /* filtres repliables */
  .filters { flex-wrap: wrap !important; overflow: visible !important; padding: 2px 12px 8px; gap: 8px; }
  .filters > * { flex: none; }
  .filters .search { flex: 1 1 auto; min-width: 0; }
  .filters .search input { width: 100%; height: 42px; border-radius: 10px; padding-left: 36px; }
  .filters .search .ic { left: 12px; top: 13px; }
  .filters .icon.sm { width: 42px; height: 42px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
  .fmore { display: inline-grid; position: relative; }
  .fmore.act::after { content: ""; position: absolute; top: 7px; right: 7px; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .filters:not(.open) > .chips, .filters:not(.open) > .fsep, .filters:not(.open) > .fsel, .filters:not(.open) > .spacer { display: none; }
  .filters.open > .chips { order: 10; width: 100%; display: flex; gap: 6px; }
  .filters.open > .chips .fchip { flex: 1; height: 40px; font-size: 15px; justify-content: center; }
  .filters.open > .fsel { order: 11; flex: 1 1 calc(50% - 4px); height: 42px; }
  .filters.open > .fsep, .filters.open > .spacer { display: none; }

  /* liste de tâches */
  .tasklist { padding: 0 10px calc(20px + env(safe-area-inset-bottom)) !important; }
  .group { margin-top: 14px; }
  .ghead { font-size: 16px; padding: 10px 6px 8px; }
  .ghead .gdesc { display: none; }
  .ghead .add { opacity: 1; }
  .gitems { border-radius: 14px; }
  .row { min-height: 52px; padding: 10px 10px 10px 12px; column-gap: 10px; row-gap: 6px; cursor: pointer; }
  .row:hover { background: transparent; }
  .title { font-size: 16.5px; line-height: 1.35; }
  .chk { width: 23px; height: 23px; border-width: 1.8px; }
  .chk .ic { width: 14px; height: 14px; }
  .chk.sm { width: 19px; height: 19px; border-width: 1.6px; }
  .chk.sm .ic { width: 11px; height: 11px; }
  .prio, button.prio { width: 23px; height: 23px; font-size: 12.5px; border-radius: 7px; }
  .chip, .chip.click { height: 28px; font-size: 13.5px; padding: 0 10px; border-radius: 14px; }
  .chip .ic { width: 14px; height: 14px; }
  .chip.sm { height: 24px; font-size: 12.5px; }
  .ctag { font-size: 13px; }
  .meta { gap: 6px; }
  .ghost-btn { width: 36px; height: 36px; border-radius: 9px; }
  .ghost-btn .ic { width: 17px; height: 17px; }
  .subs, .tbody .subs { padding: 0 10px 8px 45px !important; }
  .sub { min-height: 40px; font-size: 15.5px; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .sub:first-child { border-top: 0; }
  .sub .stxt { padding-top: 1px; line-height: 1.4; }
  .sub .chip, .sub .ghost-btn { margin-top: -6px; }
  .sub .chk { margin-top: 1px; }
  .filters:not(.open) > #subsToggle, .filters:not(.open) > [data-act="fold-all"] { display: none; }
  .filters.open > #subsToggle, .filters.open > [data-act="fold-all"] { order: 12; }
  .sub .ghost-btn { opacity: 1; }
  .sub input.stitle, .sub-add input { height: 42px; }
  .sub input[type="date"] { height: 40px; width: 150px; }
  .tbody .desc { padding: 0 12px 4px 40px !important; }
  .desc textarea { min-height: 42px; font-size: 16px; }
  .tfoot { padding: 0 12px 12px 45px !important; font-size: 14px; }
  .tfoot .btn.sm { height: 38px; font-size: 14.5px; }
  .editor { padding: 12px; }
  .ed-grid { grid-template-columns: 1fr !important; }
  .empty { font-size: 15.5px; }

  /* boutons, champs, menus, fenêtres */
  .btn { height: 42px; font-size: 15px; }
  .btn.sm { height: 36px; font-size: 14.5px; }
  .field { font-size: 13.5px; }
  .popover { left: 0 !important; right: 0 !important; top: auto !important; bottom: 0 !important; width: auto !important; max-height: 75dvh; overflow: auto; border-radius: 18px 18px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); font-size: 16px; z-index: 60; box-shadow: 0 -8px 30px rgba(0,0,0,.18); }
  .popover .ph { font-size: 15px; }
  .popover .btn { height: 46px; }
  .modal { padding: 0; align-items: end; }
  .modal-card, .modal-card.narrow { width: 100%; max-height: 92dvh; border-radius: 18px 18px 0 0; padding-bottom: env(safe-area-inset-bottom); }
  .toasts { bottom: calc(var(--bnh) + 12px); width: calc(100% - 24px); }
  .toast { font-size: 15px; padding: 12px 12px 12px 16px; }
  .mcard { border-radius: 12px; }
  .subject { font-size: 15.5px; padding: 9px 0; gap: 10px; }
  .subject .chk { margin-top: 0; }
  .subject-add input { height: 42px; }
  .mhead { min-height: 48px; }
  .ai-form textarea { min-height: 46px; }
}

</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon" data-act="toggle-left" title="Afficher / masquer les réunions"><i data-icon="pleft" data-size="18"></i></button>
    <div class="brand"><span class="logo"><i data-icon="check" data-size="15"></i></span>To-do <span class="muted">IP Paris</span></div>
    <nav class="tabs" aria-label="Vues">
      <button class="tab" data-act="tab" data-tab="tasks"><i data-icon="list"></i><span class="lbl">Tâches</span></button>
      <button class="tab" data-act="tab" data-tab="stats"><i data-icon="chart"></i><span class="lbl">Statistiques</span></button>
      <button class="tab" data-act="tab" data-tab="ai"><i data-icon="spark"></i><span class="lbl">Assistant</span></button>
    </nav>
    <div class="spacer"></div>
    <button class="status" id="status" data-act="status"></button>
    <button class="icon" data-act="undo" title="Annuler la dernière action (Ctrl+Z)"><i data-icon="undo" data-size="18"></i></button>
    <button class="icon" data-act="theme" title="Thème"><i data-icon="auto" data-size="18"></i></button>
    <button class="icon" data-act="settings" title="Réglages"><i data-icon="sliders" data-size="18"></i></button>
    <button class="icon" data-act="toggle-right" title="Afficher / masquer l'historique"><i data-icon="pright" data-size="18"></i></button>
  </header>

<script>
'use strict';
/* ================= Utilitaires ================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const ESC = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ESC[c]);
const uid = (p) => p + '_' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3);
const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const cap = (s) => (s ? s[0].toUpperCase() + s.slice(1) : s);
const clone = (o) => JSON.parse(JSON.stringify(o));
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
const nowISO = () => new Date().toISOString();
const fmtInt = (n) => Math.round(n).toLocaleString('fr-FR');

const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } },
};

const IDB = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('todo-ipparis', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this._db = r.result; res(r.result); };
      r.onerror = () => rej(r.error);
    });
  },
  async get(k) {
    const db = await this.open();
    return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
  },
  async set(k, v) {
    const db = await this.open();
    return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(); t.onerror = () => rej(t.error); });
  },
  async del(k) {
    const db = await this.open();
    return new Promise((res) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').delete(k); t.oncomplete = () => res(); t.onerror = () => res(); });
  },
};

/* ================= Dates (chaînes locales AAAA-MM-JJ) ================= */
const pad = (n) => String(n).padStart(2, '0');
const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => toISO(new Date());
const parseISO = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return toISO(d); };
const addMonths = (s, n) => { const d = parseISO(s); const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); d.setDate(Math.min(day, new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate())); return toISO(d); };
const diffDays = (a, b) => Math.round((parseISO(a) - parseISO(b)) / 86400000);
const isISODate = (s) => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);
function isoWeek(s) {
  const d = parseISO(s);
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y = t.getUTCFullYear();
  return { year: y, week: Math.ceil(((t - Date.UTC(y, 0, 1)) / 86400000 + 1) / 7) };
}
const weekStart = (s) => addDays(s, -((parseISO(s).getDay() + 6) % 7));
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
const MOIS_C = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const JOURS_C = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const thisYear = () => new Date().getFullYear();
function fmtShort(s) { const d = parseISO(s); return `${d.getDate()} ${MOIS_C[d.getMonth()]}${d.getFullYear() !== thisYear() ? ' ' + d.getFullYear() : ''}`; }
function fmtDow(s) { const d = parseISO(s); return `${JOURS_C[d.getDay()]} ${fmtShort(s)}`; }
function fmtLong(s) { const d = parseISO(s); return `${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]} ${d.getFullYear()}`; }
function fmtDay(s) {
  const n = diffDays(s, today());
  if (n === 0) return "Aujourd'hui";
  if (n === -1) return 'Hier';
  const d = parseISO(s);
  return `${cap(JOURS[d.getDay()])} ${d.getDate()} ${MOIS[d.getMonth()]}${d.getFullYear() !== thisYear() ? ' ' + d.getFullYear() : ''}`;
}
function relDays(s) {
  const n = diffDays(s, today());
  if (n === 0) return "aujourd'hui";
  if (n === 1) return 'demain';
  if (n === -1) return 'hier';
  if (n < 0) return `il y a ${-n} j`;
  if (n < 14) return `dans ${n} j`;
  return `dans ${Math.round(n / 7)} sem.`;
}
function fmtStamp(iso) {
  if (!iso) return '?';
  const d = new Date(iso);
  if (isNaN(d)) return '?';
  return `${toISO(d) === today() ? "aujourd'hui" : fmtShort(toISO(d))} à ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ================= Icônes ================= */
const ICONS = {
  check: '<path d="M20 6 9 17l-5-5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  cal: '<rect x="3" y="4.5" width="18" height="17" rx="2"/><path d="M16 2.5v4M8 2.5v4M3 10h18"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
  trash: '<path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  chev: '<path d="m9 18 6-6-6-6"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/>',
  sliders: '<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>',
  chart: '<path d="M3 3v18h18"/><path d="M7 16v-5M12 16V7M17 16v-3"/>',
  list: '<path d="M9 6h12M9 12h12M9 18h12"/><path d="m3 6 1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/>',
  undo: '<path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor"/>',
  pleft: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/>',
  pright: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18"/>',
  note: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6M8 13h8M8 17h5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  spark: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8Z"/>',
  file: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Z"/><path d="M14 3v6h6"/>',
  down: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  alert: '<path d="M12 3 2 21h20Z"/><path d="M12 10v4M12 17.5v.5"/>',
  arrow: '<path d="M7 17 17 7M8 7h9v9"/>',
  paw: '<circle cx="5" cy="10" r="2.2"/><circle cx="9" cy="5" r="2.2"/><circle cx="15" cy="5" r="2.2"/><circle cx="19" cy="10" r="2.2"/><path d="M12 11.5c-3.2 0-6.2 3.8-6.2 6.4 0 1.7 1.4 2.6 3.1 2.6 1.3 0 2-.7 3.1-.7s1.8.7 3.1.7c1.7 0 3.1-.9 3.1-2.6 0-2.6-3-6.4-6.2-6.4Z"/>',
  fold: '<path d="m7 15 5 5 5-5M7 9l5-5 5 5"/>',
  tag: '<path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8Z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
};
function icon(name, size = 16) {
  return `<svg class="ic" viewBox="0 0 24 24" width="${size}" height="${size}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ''}</svg>`;
}

/* ================= Données ================= */
const PRIO = { 1: 'Urgent / important', 2: 'À faire', 3: 'Pas urgent' };
const SLOT_NAMES = ['Automatique', 'Bleu', 'Orange', 'Turquoise', 'Jaune', 'Rose', 'Vert', 'Violet', 'Rouge'];
let D = null;

function emptyData() {
  return {
    app: 'todo-ipparis', version: 1,
    meta: { id: uid('db'), created: nowISO(), updated: nowISO(), rev: 0 },
    settings: { askDate: true },
    categories: [], meetings: [], tasks: [], history: [],
  };
}

function normalize(d) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error("Ce fichier n'est pas une to-do valide.");
  if (!Array.isArray(d.tasks) && !Array.isArray(d.history)) throw new Error("Ce fichier JSON ne contient ni tâches ni historique.");
  d.app = 'todo-ipparis';
  d.version = d.version || 1;
  d.meta = d.meta && typeof d.meta === 'object' ? d.meta : {};
  d.meta.id = d.meta.id || uid('db');
  d.meta.rev = d.meta.rev || 0;
  d.settings = d.settings && typeof d.settings === 'object' ? d.settings : {};
  if (d.settings.askDate === undefined) d.settings.askDate = true;
  for (const k of ['categories', 'meetings', 'tasks', 'history']) if (!Array.isArray(d[k])) d[k] = [];
  d.tasks = d.tasks.filter((t) => t && typeof t === 'object');
  d.tasks.forEach((t) => {
    t.id = t.id || uid('t');
    t.title = String(t.title ?? '');
    t.category = String(t.category ?? '');
    t.priority = [1, 2, 3].includes(Number(t.priority)) ? Number(t.priority) : null;
    t.due = isISODate(t.due) ? t.due : null;
    t.meetings = Array.isArray(t.meetings) ? t.meetings.filter(Boolean) : [];
    t.subtasks = Array.isArray(t.subtasks) ? t.subtasks.filter((s) => s && typeof s === 'object') : [];
    t.subtasks.forEach((s) => { s.id = s.id || uid('s'); s.title = String(s.title ?? ''); s.done = !!s.done; s.due = isISODate(s.due) ? s.due : null; });
    t.notes = String(t.notes ?? '');
  });
  d.history = d.history.filter((h) => h && typeof h === 'object' && isISODate(h.date));
  d.history.forEach((h) => {
    h.id = h.id || uid('h');
    h.title = String(h.title ?? '');
    h.category = String(h.category ?? '');
    h.meetings = Array.isArray(h.meetings) ? h.meetings : [];
    h.kind = h.kind || 'manual';
  });
  d.meetings = d.meetings.filter((m) => m && typeof m === 'object');
  d.meetings.forEach((m) => { m.id = m.id || uid('m'); m.title = String(m.title || 'Sans titre'); m.date = isISODate(m.date) ? m.date : null; m.category = m.category || ''; });
  d.categories = d.categories.filter((c) => c && c.name);
  const names = new Set(d.categories.map((c) => c.name));
  const used = [...d.tasks.map((t) => t.category), ...d.history.map((h) => h.category), ...d.history.flatMap((h) => h.tags || []), ...d.meetings.map((m) => m.category)].filter(Boolean);
  used.forEach((n) => { if (!names.has(n)) { d.categories.push({ name: n, slot: 0, desc: '' }); names.add(n); } });
  d.categories.forEach((c) => { c.slot = Number.isInteger(c.slot) && c.slot >= 0 && c.slot <= 8 ? c.slot : 0; c.desc = c.desc || ''; });
  return d;
}

function serialize(d) {
  const out = ['{'];
  const keys = Object.keys(d);
  keys.forEach((k, i) => {
    const v = d[k];
    const comma = i < keys.length - 1 ? ',' : '';
    if (Array.isArray(v) && v.length) {
      out.push(`  ${JSON.stringify(k)}: [`);
      v.forEach((x, j) => out.push(`    ${JSON.stringify(x)}${j < v.length - 1 ? ',' : ''}`));
      out.push(`  ]${comma}`);
    } else out.push(`  ${JSON.stringify(k)}: ${JSON.stringify(v)}${comma}`);
  });
  out.push('}');
  return out.join('\n') + '\n';
}

/* --- accès --- */
const findTask = (id) => D.tasks.find((t) => t.id === id);
const findMeeting = (id) => D.meetings.find((m) => m.id === id);
const meetingTitle = (id) => (findMeeting(id) || {}).title || 'Réunion supprimée';
const meetingActive = (id) => { const m = findMeeting(id); return !!m && !m.archived; };
function activeMeetings() {
  return D.meetings.filter((m) => !m.archived).sort((a, b) => {
    if (a.date && b.date) return a.date.localeCompare(b.date);
    if (a.date) return -1;
    if (b.date) return 1;
    return a.title.localeCompare(b.title, 'fr');
  });
}
const findCat = (name) => D.categories.find((c) => c.name === name);
const catSlot = (name) => (findCat(name) || {}).slot || 0;
// Couleur d'une catégorie : la couleur choisie (1–8), sinon une teinte automatique stable, bien répartie (angle d'or)
function catColor(name) {
  const c = findCat(name);
  if (!c) return 'var(--s0)';
  if (c.slot) return `var(--s${c.slot})`;
  // rang parmi les catégories sans couleur choisie → palette complémentaire de 12 teintes, distinctes des 8 couleurs réglables
  const k = D.categories.filter((x) => !x.slot).indexOf(c);
  return `var(--a${k % 12})`;
}
function catTag(name, extraCls = '') {
  const c = findCat(name);
  const title = c && c.desc ? `${c.name} — ${c.desc}` : (name || 'Sans catégorie');
  return `<span class="ctag ${extraCls}" title="${esc(title)}"><i style="background:${catColor(name)}"></i>${esc(name || '—')}</span>`;
}
function ensureCat(name) {
  name = String(name || '').trim().replace(/\s+/g, ' ');
  if (!name) return '';
  const ex = D.categories.find((c) => norm(c.name) === norm(name));
  if (ex) return ex.name;
  D.categories.push({ name, slot: 0, desc: '' });
  return name;
}
function matchCat(q) {
  const n = norm(q).replace(/_/g, ' ');
  return D.categories.find((c) => norm(c.name) === n) || D.categories.find((c) => norm(c.name).startsWith(n)) || D.categories.find((c) => norm(c.desc) === n);
}
function matchMeeting(q) {
  const n = norm(q).replace(/_/g, ' ');
  const ms = activeMeetings();
  return ms.find((m) => norm(m.title) === n) || ms.find((m) => norm(m.title).split(/\s+/).some((w) => w.startsWith(n))) || ms.find((m) => norm(m.title).includes(n));

function newTask(o) {
  return Object.assign({ id: uid('t'), title: '', category: '', priority: null, due: null, meetings: [], subtasks: [], notes: '', created: today() }, o);
}
function histEntry(o) {
