  'task-due': (el, t) => { mutate('échéance', () => { t.due = isISODate(el.value) ? el.value : null; }); },
  'task-notes': (el, t) => { if (el.value !== t.notes) mutate('notes', () => { t.notes = el.value; }); },
  'sub-title': (el, t) => { const s = t.subtasks.find((x) => x.id === el.dataset.sid); const v = el.value.trim(); if (!s) return; if (!v) { el.value = s.title; return; } mutate('sous-tâche', () => { s.title = v; }); },
  'sub-due': (el, t) => { const s = t.subtasks.find((x) => x.id === el.dataset.sid); if (s) mutate('échéance', () => { s.due = isISODate(el.value) ? el.value : null; }); },
};
function onChange(e) {
  // différé : laisse le navigateur finir de déplacer le focus (Tab) avant de redessiner
  const el = e.target;
  if (el.dataset && el.dataset.ch) setTimeout(() => handleChange(el), 0);
}
function handleChange(el) {
  const k = el.dataset.ch;
  if (CHANGES[k]) { const t = findTask(el.dataset.id); if (t) CHANGES[k](el, t); return; }
  switch (k) {
    case 'f-cat': UI.cat = el.value; savePrefs(); render(); break;
    case 'f-meet': UI.meet = el.value; savePrefs(); render(); break;
    case 'f-group': UI.groupBy = el.value; savePrefs(); render(); break;
    case 'st-period': UI.stats.period = el.value; savePrefs(); render(); break;
    case 'ai-provider': setAiCfg({ provider: el.value }); renderSettings(); if (UI.tab === 'ai') render(); break;
    case 'ai-key': setAiCfg(aiCfg().provider === 'anthropic' ? { keyA: el.value.trim() } : { keyO: el.value.trim() }); renderSettings(); if (UI.tab === 'ai') render(); break;
    case 'ai-model': setAiCfg(aiCfg().provider === 'anthropic' ? { modelA: el.value } : { modelO: el.value }); renderSettings(); if (UI.tab === 'ai') render(); break;
    case 'ai-months': setAiCfg({ months: Number(el.value) }); renderSettings(); if (UI.tab === 'ai') render(); break;
    case 'ai-custom': setAiCfg({ custom: el.value.trim() }); renderSettings(); break;
    case 'ai-cin': setAiCfg({ cIn: el.value }); renderSettings(); break;
    case 'ai-cout': setAiCfg({ cOut: el.value }); renderSettings(); break;
    case 'ai-maxcost': setAiCfg({ maxCost: Math.max(0, parseFloat(el.value) || 0) }); break;
    case 'set-p1max': { const v = Math.max(1, Math.min(200, Math.round(Number(el.value)) || 15)); mutate('réglage', () => { D.settings.p1Max = v; }); break; }
    case 'set-askdate': mutate('réglage', () => { D.settings.askDate = el.checked; }); break;
    case 'set-theme': UI.theme = el.value; applyTheme(); savePrefs(); render(); break;
    case 'cat-slot': { const c = D.categories[Number(el.dataset.i)]; if (c) { mutate('couleur', () => { c.slot = Number(el.value); }); renderSettings(); } break; }
    case 'cat-desc': { const c = D.categories[Number(el.dataset.i)]; if (c) { mutate('description', () => { c.desc = el.value.trim(); }); renderSettings(); } break; }
    case 'cat-name': { const c = D.categories[Number(el.dataset.i)]; if (c) { renameCategory(c.name, el.value); renderSettings(); } break; }
    default: break;
  }
}
const onSearch = debounce(() => withFocus(renderTasks), 90);
const onHistSearch = debounce(() => { UI.histDays = 30; withFocus(renderHistory); }, 120);
function onInput(e) {
  if (e.target.dataset.pop === 'cat') { POP.catQ = e.target.value; $('#popCatList').innerHTML = catListHTML(e.target.dataset.id); return; }
  if (e.target.dataset.autosize !== undefined) autosize(e.target);
  const k = e.target.dataset.in;
  if (k === 'f-q') { UI.q = e.target.value; onSearch(); }
  else if (k === 'h-q') { UI.histQ = e.target.value; onHistSearch(); }
  else if (e.target.id === 'qaTitle') renderQaPreview();
  else if (e.target.id === 'aiInput') { e.target.style.height = 'auto'; e.target.style.height = Math.min(200, e.target.scrollHeight) + 'px'; }
}

// Aperçu de ce que la saisie rapide a compris (#catégorie, !priorité, @réunion, >date)
function renderQaPreview() {
  const box = $('#qaPreview');
  if (!box) return;
  const raw = $('#qaTitle').value;
  if (!/(^|\s)[#!@>]\S/.test(raw)) { box.innerHTML = ''; box.classList.remove('on'); return; }
  const q = parseQuick(raw);
  const out = [];
  if (q.category) { const known = !!matchCat(q.category); out.push(`<span class="chip"><i class="sw" style="background:${catColor(q.category)}"></i>${esc(q.category)}${known ? '' : ' <em>(nouvelle)</em>'}</span>`); }
  if (q.priority) out.push(`<span class="chip"><span class="prio p${q.priority} sm">${q.priority}</span>${esc(PRIO[q.priority])}</span>`);
  if (q.meeting) out.push(`<span class="chip meet">${icon('users')}${esc(meetingTitle(q.meeting))}</span>`);
  if (q.due) out.push(`<span class="chip ${dueClass(q.due)}">${icon('cal')}${esc(fmtShort(q.due))}${dueLabel(q.due) !== fmtShort(q.due) ? ' · ' + esc(dueLabel(q.due)) : ''}</span>`);
  if (q.priority === 1 && !q.due) out.push(`<span class="qp-warn">${icon('cal')}P1 sans échéance : ajoute <b>&gt;jj/mm</b></span>`);
  if (q.priority === 1 && p1Count() >= p1Max()) out.push(`<span class="qp-warn">déjà ${p1Count()} P1 (objectif ${p1Max()})</span>`);
  box.innerHTML = out.length ? `<span class="qp-l">Sera ajoutée avec</span>${out.join('')}` : '';
  box.classList.toggle('on', out.length > 0);
}

/* ================= Formulaires ================= */
function onSubmit(e) {
  const f = e.target.closest('form[data-form]');
  if (!f) return;
  e.preventDefault();
  const kind = f.dataset.form;
  if (kind === 'gh') { ghConnect(f); return; }
  const val = (n) => (f.elements[n] ? f.elements[n].value.trim() : '');
  if (kind === 'qa') {
    const raw = $('#qaTitle').value;
    const q = parseQuick(raw);
    if (!q.title) return;
    const prio = q.priority || Number($('#qaPrio').value) || null;
    const due = q.due || ($('#qaDue').value || null);
    mutate('nouvelle tâche', () => {
      const cat = ensureCat(q.category || $('#qaCat').value);
      const t = newTask({ title: q.title, category: cat, priority: prio, due, meetings: q.meeting ? [q.meeting] : [] });
      D.tasks.push(t);
      if (UI.cat && UI.cat !== cat) UI.cat = '';
      delete UI.collapsed[UI.groupBy + '|c:' + cat];
    });
    $('#qaTitle').value = ''; $('#qaDue').value = ''; $('#qaPrio').value = ''; $('#qaCat').value = ''; renderQaPreview();
    toast('Tâche ajoutée' + (q.meeting ? ' (sujet : ' + meetingTitle(q.meeting) + ')' : ''));
    if (prio === 1) p1Nudge(D.tasks[D.tasks.length - 1]);
  } else if (kind === 'meeting') {
    const title = val('title');
    if (!title) return;
    const date = isISODate(val('date')) ? val('date') : null;
    const id = f.dataset.id;
    mutate(id === 'new' ? 'nouvelle réunion' : 'réunion modifiée', () => {
      const category = ensureCat(val('category'));
      if (id === 'new') D.meetings.push({ id: uid('m'), title, date, category, lastHeld: null });
      else { const m = findMeeting(id); if (m) Object.assign(m, { title, date, category }); }
      UI.meetingForm = null;
    });
  } else if (kind === 'hist-add') {
    const title = val('title');
    const date = val('date');
    if (!title || !isISODate(date)) return;
    mutate('action ajoutée', () => { D.history.push(histEntry({ date, title, category: ensureCat(val('category')) })); });
    f.elements.title.value = '';
    f.elements.title.focus();
    toast(`Ajouté à l'historique du ${fmtShort(date)}`);
  } else if (kind === 'hist-edit') {
    const h = D.history.find((x) => x.id === f.dataset.id);
    const title = val('title');
    const date = val('date');
    if (!h || !title || !isISODate(date)) return;
    mutate("modification de l'historique", () => {
      h.title = title; h.date = date; h.category = ensureCat(val('category'));
      if (h.kind === 'subtask') { const t = findTask(h.taskId); const s = t && t.subtasks.find((x) => x.id === h.subId); if (s) s.doneDate = date; }
      UI.histEditing = null;
    });
  } else if (kind === 'ai') {
    aiSend($('#aiInput').value);
  }
}

/* ================= Clavier ================= */
const ENTER = {
  'add-sub': (el) => {
    const t = findTask(el.dataset.id);
    const v = el.value.trim();
    if (!t || !v) return;
    mutate('nouvelle sous-tâche', () => { t.subtasks.push({ id: uid('s'), title: v, done: false, due: null }); UI.addSubFor = t.id; });
    const i = $(`[data-fk="addsub-${CSS.escape(t.id)}"]`);
    if (i) { i.value = ''; i.focus(); }
  },
  'add-subject': (el) => {
    const m = findMeeting(el.dataset.mid);
    const v = el.value.trim();
    if (!m || !v) return;
    mutate('nouveau sujet', () => { D.tasks.push(newTask({ title: v, category: ensureCat(m.category), meetings: [m.id] })); });
    const i = $(`[data-fk="as-${CSS.escape(m.id)}"]`);
    if (i) { i.value = ''; i.focus(); }
  },
  'pop-ok': () => ACTIONS['pop-ok'](),
  'due-ok': (el) => ACTIONS['due-ok'](el),
  'cat-ok': (el) => { const b = $('#popCatList .mi'); if (b) ACTIONS['set-cat'](b); else if (el.value.trim()) { const t = findTask(el.dataset.id); if (t) mutate('catégorie', () => { t.category = ensureCat(el.value); }); closePop(null); } },
};
const typing = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.tagName === 'SELECT' || el.isContentEditable);
function setPriority(id, v) {
  const t = findTask(id);
  if (t && (t.priority || 0) !== v) {
    mutate('priorité', () => { t.priority = v || null; });
    if (v === 1) p1Nudge(t);
    else if (UI.prio.length === 1 && UI.prio[0] === 1) { const n = p1Count(), max = p1Max(); toast(n > max ? `Encore ${n - max} P1 à rétrograder (${n} / ${max})` : `Objectif atteint : ${n} P1 sur ${max} maximum`, { label: 'Annuler', run: undo }); }
  }
}
function setDue(id, sid, v) {
  const t = findTask(id);
  if (!t) return;
  const target = sid ? t.subtasks.find((x) => x.id === sid) : t;
  if (target && (target.due || null) !== v) mutate('échéance', () => { target.due = v; });
}
function commitEdit(el) {
  const t = findTask(el.dataset.id);
  if (!t) return;
  const text = el.textContent.replace(/\s+/g, ' ').trim();
  if (el.dataset.edit === 'task-title') {
    if (!text) { el.textContent = t.title; return; }
    if (text !== t.title) mutate('intitulé', () => { t.title = text; });
  } else if (el.dataset.edit === 'sub-title') {
    const s = t.subtasks.find((x) => x.id === el.dataset.sid);
    if (!s) return;
    if (!text) { el.textContent = s.title; return; }
    if (text !== s.title) mutate('sous-tâche', () => { s.title = text; });
  }
}
function onFocusIn(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.edit) return;
  el.spellcheck = true;
  if (el.dataset.edit === 'task-title') setSelected(el.dataset.id);
}
function onFocusOut(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.edit) return;
  el.spellcheck = false;
  setTimeout(() => commitEdit(el), 0);
}
function onPaste(e) {
  const el = e.target.closest && e.target.closest('[data-edit]');
  if (!el) return;
  e.preventDefault();
  const txt = ((e.clipboardData && e.clipboardData.getData('text/plain')) || '').replace(/\s+/g, ' ');
  document.execCommand('insertText', false, txt);
}
function editKey(e, el) {
  if (e.key === 'Enter') { e.preventDefault(); el.blur(); return true; }
  if (e.key === 'Escape') {
    e.preventDefault();
    const t = findTask(el.dataset.id);
    const s = t && el.dataset.sid ? t.subtasks.find((x) => x.id === el.dataset.sid) : null;
    if (t) el.textContent = s ? s.title : t.title;
    el.blur();
    return true;
  }
  return false;
}

function onKey(e) {
  const el = e.target;
  if (el.dataset && el.dataset.edit && editKey(e, el)) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); if (D) Store.saveNow(); return; }
  if (e.key === 'Escape') {
    if (!$('#pop').hidden) { closePop(null); return; }
    if (!$('#modal').hidden) { closeModal(undefined); return; }
    if (UI.histEditing || UI.meetingForm || UI.expanded || UI.addSubFor || UI.histAdd) { UI.histEditing = null; UI.meetingForm = null; UI.expanded = null; UI.addSubFor = null; UI.histAdd = false; render(); return; }
    if (typing(el)) el.blur();
    return;
  }
  if (e.key === 'Enter' && el.dataset && el.dataset.enter) {
    if (el.tagName === 'TEXTAREA' && e.shiftKey) return;
    e.preventDefault();
    const fn = ENTER[el.dataset.enter];
    if (fn) fn(el);
    return;
  }
  if (e.key === 'Enter' && el.id === 'aiInput' && !e.shiftKey) { e.preventDefault(); aiSend(el.value); return; }
  if (typing(el) || !D || !$('#gate').hidden || !$('#modal').hidden) return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[0-3]$/.test(e.key)) {
    const id = POP.key && POP.key.startsWith('prio:') ? POP.key.slice(5) : UI.expanded;
    if (id && findTask(id)) { e.preventDefault(); setPriority(id, Number(e.key)); closePop(null); return; }
  }
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); if (UI.tab !== 'tasks') { UI.tab = 'tasks'; render(); } $('#qaTitle').focus(); }
  else if (e.key === '/') { e.preventDefault(); if (UI.tab !== 'tasks') { UI.tab = 'tasks'; render(); } $('#fq').focus(); }
}

/* ================= Démarrage ================= */
function onClick(e) {
  POP.justClosed = null;
  if (!$('#pop').hidden && !e.target.closest('#pop')) { POP.justClosed = POP.key; closePop(null); }
  if (!$('#modal').hidden && e.target.id === 'modal') { closeModal(undefined); return; }
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (!fn) return;
  if (el.tagName !== 'INPUT' && !el.isContentEditable) e.preventDefault();
  e.stopPropagation();
  fn(el, e);
}
function bindEvents() {
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('input', onInput);
  document.addEventListener('submit', onSubmit);
  document.addEventListener('keydown', onKey);
  document.addEventListener('focusin', onFocusIn);
  document.addEventListener('focusout', onFocusOut);
  document.addEventListener('paste', onPaste);
  $('#statsBody').addEventListener('mousemove', statsHover);
  $('#statsBody').addEventListener('mouseleave', () => { $('#tooltip').hidden = true; $$('#statsBody svg').forEach((s) => s.classList.remove('hl')); });
  window.addEventListener('resize', debounce(() => { if (D && UI.tab === 'stats') renderStats(); }, 150));
  window.addEventListener('focus', () => Store.checkExternal());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') Store.checkExternal(); else if (Store.dirty && Store.live()) Store.save(); });
  window.addEventListener('beforeunload', (e) => {
    if (Store.live() && (Store.dirty || Store.saving)) { Store.save(); e.preventDefault(); e.returnValue = ''; }
  });
  setInterval(() => { if (D && Store.live() && document.visibilityState === 'visible') Store.checkExternal(); }, 60000);
  let lastDay = today();
  setInterval(() => { if (today() !== lastDay) { lastDay = today(); render(); } }, 60000);
}
async function boot() {
  $$('[data-icon]').forEach((n) => { n.outerHTML = icon(n.dataset.icon, Number(n.dataset.size) || 16); });
  applyTheme();
  bindEvents();
  if (window.__TODO_TEST__) return;
  if (GH.cfg()) {
    try { await Store.ghOpen(); return; }
    catch (e) {
      if (e && (e.status === 401 || e.status === 404 || e.status === 403)) { toast(e.message); showGate('gh'); return; }
      if (Store.ghOffline(e)) { toast('Hors ligne : copie de cet appareil, synchronisation dès le retour du réseau'); return; }
      toast(e.message || String(e)); showGate('gh'); return;
    }
  }
  if (location.protocol === 'file:') return bootLocal();
  showGate('gh');
}
window.addEventListener('online', () => { if (Store.mode === 'gh') Store.ghCheck(); });
boot();

</script>
