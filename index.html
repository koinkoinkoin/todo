}

/* ================= Mutations + annulation ================= */
const undoStack = [];
function mutate(label, fn) {
  undoStack.push({ label, snap: JSON.stringify(D) });
  if (undoStack.length > 40) undoStack.shift();
  fn();
  D.meta.updated = nowISO();
  D.meta.rev = (D.meta.rev || 0) + 1;
  Store.changed();
  render();
}
function undo() {
  const u = undoStack.pop();
  if (!u) { toast('Rien à annuler'); return; }
  D = JSON.parse(u.snap);
  D.meta.updated = nowISO();
  D.meta.rev = (D.meta.rev || 0) + 1;
  Store.changed();
  render();
  toast(`Annulé : ${u.label}`);
}

function completeTask(id, date, viaMeeting) {
  const t = findTask(id);
  if (!t) return;
  const partial = viaMeeting && t.meetings.length > 1;
  mutate(viaMeeting ? 'sujet traité' : 'tâche terminée', () => {
    const snap = clone(t);
    if (partial) {
      t.meetings = t.meetings.filter((m) => m !== viaMeeting);
      D.history.push(histEntry({ date, title: t.title, category: t.category, meetings: [viaMeeting], kind: 'meeting', taskId: t.id, snapshot: snap }));
    } else {
      const open = t.subtasks.filter((s) => !s.done);
      const h = histEntry({ date, title: t.title, category: t.category, meetings: [...t.meetings], kind: viaMeeting ? 'meeting' : 'task', taskId: t.id, snapshot: snap });
      if (open.length) h.note = 'Sous-tâches non faites : ' + open.map((s) => s.title).join(' ; ');
      D.history.push(h);
      D.tasks = D.tasks.filter((x) => x !== t);
      if (UI.expanded === id) UI.expanded = null;
    }
  });
  toastUndo(`${viaMeeting ? 'Sujet traité' : 'Fait'} → historique du ${fmtShort(date)}`);
}
function completeSub(tid, sid, date) {
  const t = findTask(tid);
  const s = t && t.subtasks.find((x) => x.id === sid);
  if (!s) return;
  mutate('sous-tâche faite', () => {
    const h = histEntry({ date, title: s.title, category: t.category, kind: 'subtask', taskId: t.id, subId: s.id, parent: t.title });
    D.history.push(h);
    s.done = true; s.doneDate = date; s.histId = h.id;
  });
  toastUndo(`Sous-tâche faite → historique du ${fmtShort(date)}`);
}
function uncheckSub(tid, sid) {
  const t = findTask(tid);
  const s = t && t.subtasks.find((x) => x.id === sid);
  if (!s) return;
  mutate('sous-tâche décochée', () => {
    D.history = D.history.filter((h) => h.id !== s.histId && !(h.kind === 'subtask' && h.subId === s.id));
    s.done = false; delete s.doneDate; delete s.histId;
  });
}
function restoreHistory(hid) {
  const h = D.history.find((x) => x.id === hid);
  if (!h) return;
  mutate('restauration', () => {
    D.history = D.history.filter((x) => x !== h);
    UI.histEditing = null;
    const t = h.taskId ? findTask(h.taskId) : null;
    if (h.kind === 'subtask') {
      if (t) {
        const s = t.subtasks.find((x) => x.id === h.subId);
        if (s) { s.done = false; delete s.doneDate; delete s.histId; } else t.subtasks.push({ id: uid('s'), title: h.title, done: false, due: null });
      } else D.tasks.push(newTask({ title: h.title, category: h.category, notes: h.parent ? `Sous-tâche de : ${h.parent}` : '' }));
    } else if (t) {
      (h.meetings || []).forEach((m) => { if (meetingActive(m) && !t.meetings.includes(m)) t.meetings.push(m); });
    } else if (h.snapshot) {
      const nt = clone(h.snapshot);
      nt.meetings = (nt.meetings || []).filter(meetingActive);
      if (findTask(nt.id)) nt.id = uid('t');
      D.tasks.push(nt);
    } else {
      D.tasks.push(newTask({ title: h.title, category: h.category, meetings: (h.meetings || []).filter(meetingActive) }));
    }
  });
  toast('Restauré dans la to-do');
}
function closeMeeting(mid, date) {
  const m = findMeeting(mid);
  if (!m) return;
  const subjects = D.tasks.filter((t) => t.meetings.includes(mid));
  mutate('réunion tenue', () => {
    for (const t of subjects) {
      const snap = clone(t);
      if (t.meetings.length > 1) {
        t.meetings = t.meetings.filter((x) => x !== mid);
        D.history.push(histEntry({ date, title: t.title, category: t.category, meetings: [mid], kind: 'meeting', taskId: t.id, snapshot: snap }));
      } else {
        D.history.push(histEntry({ date, title: t.title, category: t.category, meetings: [mid], kind: 'meeting', taskId: t.id, snapshot: snap }));
        D.tasks = D.tasks.filter((x) => x !== t);
      }
    }
    m.lastHeld = date;
    m.date = null;
  });
  toastUndo(`${m.title} : ${subjects.length} sujet(s) → historique du ${fmtShort(date)}`);
}
function renameCategory(oldName, newName) {
  newName = String(newName || '').trim().replace(/\s+/g, ' ');
  if (!newName || newName === oldName) return;
  const target = D.categories.find((c) => c.name !== oldName && norm(c.name) === norm(newName));
  const apply = () => mutate(target ? 'fusion de catégories' : 'catégorie renommée', () => {
    const finalName = target ? target.name : newName;
    D.tasks.forEach((t) => { if (t.category === oldName) t.category = finalName; });
    D.history.forEach((h) => {
      if (h.category === oldName) h.category = finalName;
      if (h.tags) h.tags = [...new Set(h.tags.map((x) => (x === oldName ? finalName : x)))].filter((x) => x !== h.category);
    });
    D.meetings.forEach((m) => { if (m.category === oldName) m.category = finalName; });
    if (target) D.categories = D.categories.filter((c) => c.name !== oldName);
    else findCat(oldName).name = finalName;
    if (UI.cat === oldName) UI.cat = finalName;
  });
  if (target) {
    confirmBox(`« ${newName} » existe déjà. Fusionner « ${oldName} » dans « ${target.name} » ?`, { ok: 'Fusionner' }).then((ok) => { if (ok) apply(); else renderSettings(); });
  } else apply();
}
function catUsage(name) {
  return D.tasks.filter((t) => t.category === name).length + D.history.filter((h) => h.category === name || (h.tags || []).includes(name)).length + D.meetings.filter((m) => m.category === name && !m.archived).length;
}

/* ================= Stockage fichier ================= */
const HAS_FSA = typeof window.showOpenFilePicker === 'function';
const CACHE_KEY = 'todo-ipparis.cache';
const JSON_TYPES = [{ description: 'To-do (JSON)', accept: { 'application/json': ['.json'] } }];

const Store = {
  mode: 'none', // 'fsa' (fichier relié, enregistrement auto) | 'local' (copie navigateur + téléchargement)
  handle: null, fileName: 'todo.json', lastModified: 0, baseSave: null,
  dirty: false, saving: false, again: false, timer: null, lastSaved: null, error: '',

  ghSha: null, ghEtag: null,
  live() { return this.mode === 'fsa' || this.mode === 'gh'; },
  cache() { if (D) LS.set(CACHE_KEY, { data: D, dirty: this.dirty, base: this.baseSave, mode: this.mode, sha: this.ghSha, at: nowISO() }); },
  changed() {
    this.dirty = true;

    renderStatus();
  },
  async pickOpen() {
    const [h] = await window.showOpenFilePicker({ id: 'todo-ipparis', types: JSON_TYPES, multiple: false });
    await this.useHandle(h);
  },
  async pickCreate() {
    const h = await window.showSaveFilePicker({ id: 'todo-ipparis', suggestedName: 'todo.json', types: JSON_TYPES });
    const perm = await h.requestPermission({ mode: 'readwrite' });
    if (perm !== 'granted') throw new Error('Accès refusé');
    D = normalize(emptyData());
    this.handle = h; this.mode = 'fsa'; this.fileName = h.name; this.lastModified = 0;
    try { await IDB.set('handle', h); } catch (e) { /* ignore */ }
    await this.save(true);
    hideGate(); render();
  },
  async useHandle(h) {
    let perm = await h.queryPermission({ mode: 'readwrite' });
    if (perm !== 'granted') { try { perm = await h.requestPermission({ mode: 'readwrite' }); } catch (e) { perm = 'error'; } }
    const canWrite = perm === 'granted';
    if (!canWrite) {
      let r = await h.queryPermission({ mode: 'read' });
      if (r !== 'granted') { try { r = await h.requestPermission({ mode: 'read' }); } catch (e) { r = 'error'; } }
      if (r !== 'granted') throw new Error("L'accès au fichier a été refusé.");
    }
    const f = await h.getFile();
    const txt = await f.text();
    let data = txt.trim() ? normalize(JSON.parse(txt)) : normalize(emptyData());
    let recovered = false;
    const c = LS.get(CACHE_KEY, null);
    if (c && c.dirty && c.data && c.data.meta && c.data.meta.id === data.meta.id && c.data.meta.rev !== data.meta.rev) {
      const sameBase = c.base && c.base === data.meta.saveId;
      const msg = `Des modifications faites dans ce navigateur (${fmtStamp(c.at)}) n'ont pas été enregistrées dans le fichier.` +
        (sameBase ? '' : "\n\nAttention : le fichier a aussi été modifié ailleurs depuis. Récupérer ces modifications écrasera ces changements.");
      if (await confirmBox(msg, { ok: 'Récupérer mes modifications', cancel: 'Utiliser le fichier', danger: !sameBase })) { data = normalize(c.data); recovered = true; }
    }
    D = data;
    this.handle = h; this.mode = 'fsa'; this.fileName = h.name;
    this.lastModified = f.lastModified; this.baseSave = data.meta.saveId || null;
    this.dirty = false; this.error = canWrite ? '' : "Cliquer ici pour autoriser l'enregistrement";
    try { await IDB.set('handle', h); } catch (e) { /* ignore */ }
    this.cache();
    hideGate(); render();
    if (!canWrite) toast("Fichier ouvert en lecture : clique sur l'indicateur en haut à droite pour autoriser l'enregistrement.");

  },
  async save(force = false) {
    if (this.mode === 'gh') return this.ghSave(force);
    if (this.mode === 'local') { this.cache(); return; }
    if (this.mode !== 'fsa' || !this.handle) return;
    if (this.saving) { this.again = true; return; }
    clearTimeout(this.timer);
    this.saving = true; renderStatus();
    try {
      const f = await this.handle.getFile();
      if (!force && this.lastModified && f.lastModified !== this.lastModified) {
        let ext = null;
        try { ext = JSON.parse(await f.text()); } catch (e) { /* fichier illisible : on écrase */ }

      this.errorDetail = String((e && e.message) || e);

    }
  },
  async reauthorize() {
    if (this.mode === 'gh') { if (/jeton|introuvable|configur/i.test(this.error)) { showGate('gh'); return; } return this.save(); }
    if (!this.handle) return this.pickOpen();
    let p = 'error';
    try { p = await this.handle.requestPermission({ mode: 'readwrite' }); } catch (e) { /* ignore */ }

  },
  async checkExternal() {

  },
  download(name = 'todo.json') {

  },
  async saveNow() {
    if (this.mode === 'gh') { await this.save(); if (!this.error) toast('Enregistré sur GitHub'); }
    else if (this.mode === 'fsa') { await this.save(); if (!this.error) toast('Enregistré dans ' + this.fileName); }

};


/* ================= Synchronisation GitHub ================= */
const GH_KEY = 'todo-ipparis.github';
const GH = {
  cfg() { const c = LS.get(GH_KEY, null); return c && c.owner && c.repo && c.token ? c : null; },
  url(c, p) { return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/${p}`; },
  path(c) { return (c.path || 'todo.json').split('/').map(encodeURIComponent).join('/'); },
  headers(c, extra) { return Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28' }, extra || {}); },
  b64decode(b64) { const bin = atob(String(b64).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); },
  b64encode(txt) { const u = new TextEncoder().encode(txt); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); },
  err(status, msg) { const e = new Error(msg); e.status = status; return e; },
  async fail(r) {
    let m = ''; try { m = (await r.json()).message || ''; } catch (e) { /* ignore */ }
    if (r.status === 401) return this.err(401, 'Jeton GitHub invalide ou expiré');
    if (r.status === 403 && /rate limit/i.test(m)) return this.err(403, 'Limite de requêtes GitHub atteinte, réessayer plus tard');
    if (r.status === 403) return this.err(403, "Jeton GitHub sans droit d'écriture sur ce dépôt");
    if (r.status === 404) return this.err(404, 'Dépôt ou fichier introuvable');
    return this.err(r.status, `Erreur GitHub ${r.status}${m ? ' : ' + m : ''}`);
  },
  // -> { data, sha, etag } | { notModified: true } | { missing: true }
  async get(etag) {
    const c = this.cfg();
    if (!c) throw this.err(0, 'GitHub non configuré');
    const r = await fetch(this.url(c, 'contents/' + this.path(c)) + '?ref=' + encodeURIComponent(c.branch || 'main'), { headers: this.headers(c, etag ? { 'If-None-Match': etag } : null), cache: 'no-store' });
    if (r.status === 304) return { notModified: true };
    if (r.status === 404) {
      const repo = await fetch(this.url(c, ''), { headers: this.headers(c), cache: 'no-store' });
      if (repo.ok) return { missing: true };
      throw await this.fail(repo);
    }
    if (!r.ok) throw await this.fail(r);
    const j = await r.json();
    let txt;
    if (j.encoding === 'base64' && j.content) txt = this.b64decode(j.content);
    else {
      const b = await fetch(this.url(c, 'git/blobs/' + j.sha), { headers: this.headers(c), cache: 'no-store' });
      if (!b.ok) throw await this.fail(b);
      txt = this.b64decode((await b.json()).content);
    }
    return { data: txt.trim() ? JSON.parse(txt) : null, sha: j.sha, etag: r.headers.get('ETag') };
  },
  // -> { ok, sha } | { conflict: true }
  async put(text, sha) {
    const c = this.cfg();
    if (!c) throw this.err(0, 'GitHub non configuré');
    const body = { message: `Mise à jour depuis ${c.device || 'un navigateur'}`, content: this.b64encode(text), branch: c.branch || 'main' };
    if (sha) body.sha = sha;
    const r = await fetch(this.url(c, 'contents/' + this.path(c)), { method: 'PUT', headers: this.headers(c, { 'Content-Type': 'application/json' }), body: JSON.stringify(body), cache: 'no-store' });
    if (r.status === 409 || r.status === 422) return { conflict: true };
    if (!r.ok) throw await this.fail(r);
    const j = await r.json();
    return { ok: true, sha: j.content.sha };
  },
};

Object.assign(Store, {
  ghLabel() { const c = GH.cfg(); return c ? `${c.repo}/${c.path || 'todo.json'}` : 'GitHub'; },
  ghErr(e) {
    console.error(e);
    this.errorDetail = String((e && e.message) || e);
    if (e && e.status !== undefined) return e.message;
    return navigator.onLine === false || (e && e.name === 'TypeError') ? 'Hors ligne · modifs gardées ici' : "Erreur d'enregistrement";
  },
  async ghOpen() {
    const res = await GH.get();
    let data, recovered = false;
    if (res.missing) {
      const c = LS.get(CACHE_KEY, null);
      if (!(await confirmBox(`Le fichier ${this.ghLabel()} n'existe pas encore dans le dépôt. Le créer ${c && c.data ? 'avec la copie gardée dans ce navigateur' : 'avec une liste vide'} ?`, { ok: 'Créer', cancel: 'Annuler' }))) throw new Error('Connexion annulée');
      data = c && c.data ? normalize(c.data) : normalize(emptyData());
      D = data; this.mode = 'gh'; this.fileName = this.ghLabel(); this.ghSha = null; this.baseSave = null; this.dirty = true;
      hideGate(); render(); await this.save(true);
      return;
    }
    data = res.data ? normalize(res.data) : normalize(emptyData());
    const c = LS.get(CACHE_KEY, null);
    if (c && c.dirty && c.data && c.data.meta && c.data.meta.id === data.meta.id && c.data.meta.rev !== data.meta.rev) {
      const sameBase = c.base && c.base === data.meta.saveId;
      if (sameBase) { data = normalize(c.data); recovered = true; toast('Modifications hors ligne récupérées'); }
      else if (await confirmBox(`Des modifications faites sur cet appareil (${fmtStamp(c.at)}) n'ont pas été envoyées, et la to-do a aussi été modifiée ailleurs depuis.\n\nQuelle version garder ?`, { ok: 'Celle de cet appareil', cancel: 'Celle de GitHub', danger: true })) { data = normalize(c.data); recovered = true; }
    }
    D = data;
    this.mode = 'gh'; this.fileName = this.ghLabel();
    this.ghSha = res.sha; this.ghEtag = res.etag; this.baseSave = res.data && res.data.meta ? res.data.meta.saveId || null : null;
    this.dirty = false; this.error = '';
    this.cache();
    hideGate(); render();
    if (recovered) this.changed();
  },
  ghOffline(e) {
    const c = LS.get(CACHE_KEY, null);
    if (!c || !c.data) return false;
    try { D = normalize(c.data); } catch (x) { return false; }
    this.mode = 'gh'; this.fileName = this.ghLabel();
    this.ghSha = c.sha || null; this.baseSave = c.base || null; this.dirty = !!c.dirty;
    this.error = this.ghErr(e);
    hideGate(); render();
    return true;
  },
  async ghSave(force = false) {
    if (this.saving) { this.again = true; return; }
    clearTimeout(this.timer);
    this.saving = true; renderStatus();
    try {
      for (let attempt = 0; attempt < 3; attempt++) {
        const prevId = D.meta.saveId, prevAt = D.meta.saved;
        D.meta.saveId = uid('w');
        D.meta.saved = nowISO();
        const r = await GH.put(serialize(D), this.ghSha);
        if (r.ok) {
          this.ghSha = r.sha; this.ghEtag = null; this.baseSave = D.meta.saveId;
          this.dirty = false; this.lastSaved = new Date(); this.error = '';
          this.cache();
          return;
        }
        D.meta.saveId = prevId; D.meta.saved = prevAt;
        const ext = await GH.get();
        if (ext.missing) { this.ghSha = null; continue; }
        const extId = ext.data && ext.data.meta ? ext.data.meta.saveId : null;
        if (!force && extId && extId !== this.baseSave) {
          this.saving = false; renderStatus();
          const keepMine = await confirmBox(`La to-do a été modifiée sur un autre appareil — ${fmtStamp(ext.data.meta.saved || ext.data.meta.updated)}.\n\nQuelle version garder ?`, { ok: 'Celle de cet appareil (écraser)', cancel: "Celle de l'autre appareil", danger: true });
          this.saving = true;
          if (!keepMine) {
            D = normalize(ext.data);
            this.ghSha = ext.sha; this.ghEtag = ext.etag; this.baseSave = extId; this.dirty = false; this.error = '';
            this.cache(); render(); toast("Version de l'autre appareil chargée");
            return;
          }
        }
        this.ghSha = ext.sha;
      }
      throw new Error('Conflit persistant avec GitHub');
    } catch (e) {
      this.error = this.ghErr(e);
      this.cache();
    } finally {
      this.saving = false; renderStatus();
      if (this.again) { this.again = false; this.save(); }
    }
  },
  async ghCheck() {
    if (this.mode !== 'gh' || this.saving) return;
    if (this.dirty) { this.save(); return; }
    try {
      const ext = await GH.get(this.ghEtag);
      if (this.error) { this.error = ''; renderStatus(); }

      this.ghSha = ext.sha; this.ghEtag = ext.etag;

async function bootLocal() {

function downloadText(name, text, type = 'text/plain') {

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}

/* ================= Export TODO.txt ================= */
function exportTxt() {
  const L = ['## Légende', '1 URGENT/IMPORTANT', '2 A FAIRE', '3 PAS URGENT/IMPORTANT', '', '## TODO'];
  const byCat = new Map();
  D.tasks.forEach((t) => { const k = t.category || 'Sans catégorie'; if (!byCat.has(k)) byCat.set(k, []); byCat.get(k).push(t); });
  const order = [...D.categories.map((c) => c.name), 'Sans catégorie'];
  for (const name of order) {
    const list = byCat.get(name);
    if (!list) continue;
    L.push(`### ${name}`);
    for (const t of list) {
      const extra = [t.due ? `échéance ${t.due}` : '', t.meetings.length ? 'réunion : ' + t.meetings.map(meetingTitle).join(', ') : ''].filter(Boolean).join(' ; ');
      L.push(`${t.priority ? t.priority + ' ' : ''}${t.title}${extra ? ` (${extra})` : ''}`);
      t.subtasks.forEach((s) => L.push(`    - ${s.done ? '[x] ' : ''}${s.title}${s.due ? ` (échéance ${s.due})` : ''}`));
    }
    L.push('');
  }
  L.push('## RÉUNIONS');
  for (const m of activeMeetings()) {
    L.push(`### ${m.title}${m.date ? ' — ' + m.date : ''}`);
    D.tasks.filter((t) => t.meetings.includes(m.id)).forEach((t) => L.push(`- ${t.title}`));
    L.push('');
  }
  L.push('## DONE', '');
  const days = [...new Set(D.history.map((h) => h.date))].sort().reverse();
  for (const day of days) {
    L.push(`### ${day.replace(/-/g, '.')}`);
    D.history.filter((h) => h.date === day).forEach((h) => {
      const tags = [h.category, ...(h.tags || [])].filter(Boolean).map((x) => `[${x}]`).join(' ');
      const extra = [h.parent ? `sous-tâche de : ${h.parent}` : '', h.meetings.length ? 'réunion : ' + h.meetings.map(meetingTitle).join(', ') : ''].filter(Boolean).join(' ; ');
      L.push(`${tags ? tags + ' ' : ''}${h.title}${extra ? ` (${extra})` : ''}`);
    });
    L.push('');
  }
  downloadText('TODO.txt', L.join('\r\n'));
}

/* ================= Rendu global (avec conservation du focus) ================= */
function caretRange(el) {
  const sel = window.getSelection();
  if (!sel || !sel.rangeCount) return null;
  const r = sel.getRangeAt(0);
  if (!el.contains(r.startContainer)) return null;
  const pre = r.cloneRange();
  pre.selectNodeContents(el);
  pre.setEnd(r.startContainer, r.startOffset);
  const start = pre.toString().length;
  return [start, start + r.toString().length];
}
function setCaret(el, range) {
  const tn = el.firstChild;

  const [a, b] = range || [tn.length, tn.length];
  const r = document.createRange();
  r.setStart(tn, Math.min(a, tn.length));
  r.setEnd(tn, Math.min(b, tn.length));
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(r);

// Redessine en conservant : le champ actif, son contenu en cours de saisie, la position du curseur, les défilements.
function withFocus(fn) {

  if (key) {
    if (a.isContentEditable) ce = { text: a.textContent, orig: a.dataset.orig, range: caretRange(a) };
    else {
      if (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA') val = a.value;
      try { s = a.selectionStart; e = a.selectionEnd; } catch (err) { /* type sans sélection */ }
    }
  }
  const scrolls = $$('[data-keep-scroll]').map((el) => [el, el.scrollTop]);
  fn();
  scrolls.forEach(([el, t]) => { el.scrollTop = t; });
  if (key) {
    const n = document.querySelector(`[data-fk="${CSS.escape(key)}"]`);
    if (n && n !== document.activeElement) {
      if (ce) {
        n.textContent = ce.text;
        if (ce.orig !== undefined) n.dataset.orig = ce.orig;
        n.dataset.editing = '1';
        n.focus({ preventScroll: true });
        setCaret(n, ce.range);
      } else {
        if (val !== null && n.type !== 'date' && n.value !== val) n.value = val;
        n.focus({ preventScroll: true });
        if (s != null) { try { n.setSelectionRange(s, e); } catch (err) { /* ignore */ } }
      }
    }
  }
}

/* ================= Tâches ================= */
const prioRank = (p) => p || 4;
function cmpTask(a, b) {
  return prioRank(a.priority) - prioRank(b.priority) || (a.due || '9999').localeCompare(b.due || '9999') || (a._i - b._i);
}
function taskMatches(t, tokens) {
  if (UI.prio.length && !UI.prio.includes(t.priority || 0)) return false;
  if (UI.cat && t.category !== UI.cat) return false;
  if (UI.meet === 'hide' && t.meetings.length) return false;
  if (UI.meet === 'only' && !t.meetings.length) return false;
  if (UI.when && !taskWhen(t, UI.when)) return false;
  if (tokens.length) {
    const hay = norm([t.title, t.category, t.notes, ...t.subtasks.map((s) => s.title), ...t.meetings.map(meetingTitle)].join(' '));
    if (!tokens.every((k) => hay.includes(k))) return false;
  }
  return true;
}
function groupTasks(list) {
  const g = new Map();
  const add = (key, label, t, extra = {}) => { if (!g.has(key)) g.set(key, Object.assign({ key, label, items: [] }, extra)); g.get(key).items.push(t); };
  const t0 = today();
  switch (UI.groupBy) {
    case 'category': {
      list.forEach((t) => add('c:' + t.category, t.category || 'Sans catégorie', t, { cat: t.category }));
      const idx = new Map(D.categories.map((c, i) => [c.name, i]));
      return [...g.values()].sort((a, b) => (a.cat ? idx.get(a.cat) ?? 999 : 1000) - (b.cat ? idx.get(b.cat) ?? 999 : 1000));
    }
    case 'priority':
      list.forEach((t) => add('p:' + (t.priority || 0), t.priority ? `Priorité ${t.priority} — ${PRIO[t.priority]}` : 'Sans priorité', t, { prio: t.priority || 0 }));
      return [...g.values()].sort((a, b) => prioRank(a.prio) - prioRank(b.prio));
    case 'due': {
      const order = ['late', 'today', 'week', 'later', 'none'];
      const labels = { late: 'En retard', today: "Aujourd'hui", week: '7 prochains jours', later: 'Plus tard', none: 'Sans échéance' };
      list.forEach((t) => {
        const k = !t.due ? 'none' : t.due < t0 ? 'late' : t.due === t0 ? 'today' : diffDays(t.due, t0) <= 7 ? 'week' : 'later';
        add('d:' + k, labels[k], t, { ord: order.indexOf(k) });
      });
      return [...g.values()].sort((a, b) => a.ord - b.ord);
    }
    case 'meeting': {
      const ms = activeMeetings();
      list.forEach((t) => {
        const own = t.meetings.filter(meetingActive);
        if (!own.length) add('m:none', 'Sans réunion', t, { ord: 9999 });
        own.forEach((mid) => add('m:' + mid, meetingTitle(mid), t, { ord: ms.findIndex((m) => m.id === mid) }));
      });
      return [...g.values()].sort((a, b) => a.ord - b.ord);

// tranche d'échéance d'une tâche : late | today | week | later | none
function whenOf(t) { return dueBucket(t.due); }
function dueBucket(due) { if (!due) return 'none'; const t0 = today(); return due < t0 ? 'late' : due === t0 ? 'today' : diffDays(due, t0) <= 7 ? 'week' : 'later'; }
// le filtre « en retard » / « cette semaine » porte sur la tâche ET sur ses sous-tâches restant à faire
const inWhen = (due, w) => { const b = dueBucket(due); return b === w || (w === 'week' && b === 'today'); };

/* Tableau de bord : 4 tuiles cliquables (filtres) + activité des 14 derniers jours */
function renderKpis() {

  const tile = (key, cls, n, label, sub, act) => `<button class="kpi ${cls} ${act ? 'on' : ''}" data-act="kpi" data-k="${key}" title="${sub ? sub + ' — ' : ''}${act ? 'Retirer le filtre' : 'Filtrer la liste'}"><span class="kn">${n}</span><span class="kl">${label}</span><span class="ks">${sub}</span></button>`;

    + (p1nd ? tile('nodue', 'k-nodue', p1nd, 'P1 sans date', 'tâches prioritaires sans échéance', UI.when === 'nodue') : '')
    + tile('late', 'k-late', late, 'En retard', late ? (L.sub || 'échéance dépassée') : 'rien en retard', UI.when === 'late')

    + `<button class="kpi k-done" data-act="kpi" data-k="done" title="Ouvrir l'historique"><span class="kn">${doneWeek}</span><span class="kl">Faites cette sem.</span><svg class="spark" viewBox="0 0 126 32" preserveAspectRatio="none" aria-hidden="true">${bars}</svg></button>`;

function dueClass(due) { const t0 = today(); return due < t0 ? 'late' : diffDays(due, t0) <= 2 ? 'soon' : ''; }

function renderTasks() {

  if (reviewing && UI.when === 'nodue' && list.length) {

  } else if (reviewing && !UI.when && p1 > p1Max()) {
    html += `<div class="nudge warn">${icon('alert', 16)}<div><b>${p1} P1 pour un objectif de ${p1Max()}</b> — encore ${p1 - p1Max()} à rétrograder. Pour chacune : <i>si ce n'est pas fait dans 15 jours, y a-t-il une conséquence concrète ?</i> Sinon, clique sur sa pastille <span class="prio p1 sm">1</span> pour la passer en 2, ou sélectionne la ligne et tape <kbd>2</kbd>. Un suivi peut passer en 3 avec une date de relance.</div></div>`;
  }
  if (!list.length) {
    html = D.tasks.length ? `<div class="empty">Aucune tâche ne correspond aux filtres.</div>` : `<div class="empty">Aucune tâche. Ajoute la première ci-dessus.</div>`;
  }
  for (const g of groups) {
    const collapsed = !!UI.collapsed[UI.groupBy + '|' + g.key] && !tokens.length;
    const c = g.cat !== undefined ? findCat(g.cat) : null;
    const dot = UI.groupBy === 'category' ? `<span class="gdot" style="background:${catColor(g.cat)}"></span>` : UI.groupBy === 'priority' ? `<span class="gdot" style="background:var(--p${g.prio || 3})"></span>` : '';
    const gp1 = g.items.filter((t) => t.priority === 1).length, glate = g.items.filter((t) => taskWhen(t, 'late')).length;
    const gcol = UI.groupBy === 'category' ? catColor(g.cat) : UI.groupBy === 'priority' ? `var(--p${g.prio || 3})` : 'var(--line-2)';
    html += `<div class="group ${collapsed ? 'collapsed' : ''}" style="--gc:${gcol}">
      <div class="ghead" data-act="toggle-group" data-key="${esc(g.key)}"><span class="caret">${icon('chev', 14)}</span>${dot}<span class="glabel">${esc(g.label)}</span><span class="gcount" title="${gp1 && UI.groupBy !== 'priority' ? `dont ${gp1} en priorité 1` : ''}">${g.items.length}</span>${glate && UI.groupBy !== 'due' ? `<span class="gbadge late" title="Échéance dépassée">${glate} en retard</span>` : ''}${c && c.desc ? `<span class="gdesc">${esc(c.desc)}</span>` : ''}
        ${UI.groupBy === 'category' ? `<button class="icon sm add" data-act="add-in-group" data-cat="${esc(g.cat)}" title="Ajouter une tâche ici">${icon('plus', 15)}</button>` : ''}</div>
      <div class="gitems">${g.items.map(taskHTML).join('')}</div></div>`;
  }
  $('#taskList').innerHTML = html;
  autosize();
}

/* Une tâche = une ligne éditable sur place (priorité, intitulé, catégorie, réunions, échéance)
   + quand elle est sélectionnée : description, sous-tâches et ajout de sous-tâche. */
function taskHTML(t) {
  const sel = UI.expanded === t.id;
  const p = t.priority || 0;
  const A = (act) => `data-act="${act}" data-id="${t.id}"`;
  return `<div class="task pr${p} ${sel ? 'open' : ''}" data-tid="${t.id}">
    <div class="row" ${A('select')}>
      <button class="chk" ${A('check-task')} title="Marquer comme fait (→ historique)">${icon('check')}</button>
      <button class="prio p${p}" ${A('prio-menu')} title="Priorité : ${p ? PRIO[p] : 'aucune'} — cliquer pour changer">${p || ''}</button>
      ${isMob() && !sel ? `<span class="title">${esc(t.title)}</span>` : `<span class="title" ${A('edit')} contenteditable="plaintext-only" spellcheck="false" data-edit="task-title" data-fk="tt-${t.id}" title="Cliquer pour modifier">${esc(t.title)}</span>`}
      <span class="meta">${metaHTML(t)}</span>
    </div>
    ${taskBodyHTML(t)}
  </div>`;
}
function metaHTML(t) {
  const sel = UI.expanded === t.id;
  const A = (act) => `data-act="${act}" data-id="${t.id}"`;
  const done = t.subtasks.filter((s) => s.done).length;
  const out = [];
  if (t.category && (UI.groupBy !== 'category' || sel)) out.push(`<button class="chip click" ${A('cat-menu')} title="Catégorie — cliquer pour changer"><i class="sw" style="background:${catColor(t.category)}"></i>${esc(t.category)}</button>`);
  t.meetings.filter(meetingActive).forEach((m) => out.push(`<button class="chip meet click" ${A('meet-menu')} title="Sujet pour : ${esc(meetingTitle(m))} — cliquer pour modifier">${icon('users')}${esc(meetingTitle(m))}</button>`));
  if (t.due) out.push(dueChip(t.due, A('due-menu')));
  if (t.subtasks.length) out.push(`<span class="chip prog ${done === t.subtasks.length ? 'full' : ''}" title="Sous-tâches faites : ${done} sur ${t.subtasks.length}"><span class="pbar"><i style="width:${Math.round((done / t.subtasks.length) * 100)}%"></i></span>${done}/${t.subtasks.length}</span>`);
  if (t.notes && !sel) out.push(`<span class="chip" title="${esc(t.notes)}">${icon('note')}</span>`);
  const ghost = [];
  if (!t.category) ghost.push(`<button class="ghost-btn" ${A('cat-menu')} title="Choisir une catégorie">${icon('tag', 14)}</button>`);
  if (!t.meetings.length) ghost.push(`<button class="ghost-btn" ${A('meet-menu')} title="À évoquer en réunion…">${icon('users', 14)}</button>`);
  if (!t.due && t.priority === 1) out.push(`<button class="chip nodate click" ${A('due-menu')} title="Tâche prioritaire sans échéance — cliquer pour en fixer une">${icon('cal')}date ?</button>`);
  else if (!t.due) ghost.push(`<button class="ghost-btn" ${A('due-menu')} title="Ajouter une échéance">${icon('cal', 14)}</button>`);
  ghost.push(`<button class="ghost-btn" ${A('add-sub')} title="Ajouter une sous-tâche">${icon('plus', 15)}</button>`);
  return out.join('') + `<span class="rowact">${ghost.join('')}</span>`;
}
function taskBodyHTML(t) {
  const sel = UI.expanded === t.id;
  // tâche fermée : seules les sous-tâches restant à faire sont listées (les faites sont comptées dans « n/N » et dans l'historique)
  // filtre « en retard » / « cette semaine » actif : la tâche fermée ne montre que les sous-tâches concernées
  const focus = !sel && UI.when && !inWhen(t.due, UI.when) ? subsWhen(t, UI.when) : null;
  const shown = [...t.subtasks].filter((s) => (focus ? focus.includes(s) : sel || !s.done)).sort((a, b) => a.done - b.done);
  const hiddenN = focus ? t.subtasks.filter((s) => !s.done).length - focus.length : 0;
  const subs = shown.map((s) => subHTML(t, s)).join('') + (hiddenN > 0 ? `<li class="sub more"><button class="linkbtn" data-act="select" data-id="${t.id}">+ ${hiddenN} autre${hiddenN > 1 ? 's' : ''} sous-tâche${hiddenN > 1 ? 's' : ''}</button></li>` : '');
  let html = '<div class="tbody">';
  if (sel) html += `<div class="desc"><textarea rows="1" placeholder="Ajouter une description…" data-ch="task-notes" data-id="${t.id}" data-fk="tn-${t.id}" data-autosize>${esc(t.notes)}</textarea></div>`;
  if ((subs && (!UI.hideSubs || focus)) || sel) html += `<ul class="subs">${subs}${sel ? `<li class="sub sub-add"><span class="plus">${icon('plus', 14)}</span><input placeholder="Ajouter une sous-tâche… (Entrée)" data-enter="add-sub" data-id="${t.id}" data-fk="addsub-${t.id}"></li>` : ''}</ul>`;
  if (sel) html += `<div class="tfoot"><span>${t.created ? 'Créée le ' + esc(fmtShort(t.created)) : ''}</span><span class="spacer"></span><span class="hide-sm">Priorité au clavier : <kbd>1</kbd> <kbd>2</kbd> <kbd>3</kbd> <kbd>0</kbd></span><button class="btn sm ghost danger" data-act="del-task" data-id="${t.id}">${icon('trash', 14)}Supprimer</button></div>`;
  return html + '</div>';
}
function subHTML(t, s) {
  const A = (act) => `data-act="${act}" data-id="${t.id}" data-sid="${s.id}"`;
  if (s.done) {
    return `<li class="sub done"><button class="chk sm done" ${A('check-sub')} title="Faite le ${esc(fmtShort(s.doneDate || today()))} — cliquer pour décocher">${icon('check')}</button><span class="stxt">${esc(s.title)}</span><span class="chip sm">${esc(fmtShort(s.doneDate || today()))}</span></li>`;
  }
  return `<li class="sub"><button class="chk sm" ${A('check-sub')} title="Cocher (→ historique)">${icon('check')}</button>
    ${isMob() && UI.expanded !== t.id ? `<span class="stxt" data-act="select" data-id="${t.id}">${esc(s.title)}</span>${s.due ? dueChip(s.due, A('due-menu')) : ''}</li>` : `<span class="stxt" ${A('edit')} contenteditable="plaintext-only" spellcheck="false" data-edit="sub-title" data-fk="sx-${s.id}" title="Cliquer pour modifier">${esc(s.title)}</span>
    ${s.due ? dueChip(s.due, A('due-menu')) : `<button class="ghost-btn" ${A('due-menu')} title="Échéance de la sous-tâche">${icon('cal', 13)}</button>`}
    <button class="ghost-btn" ${A('del-sub')} title="Supprimer la sous-tâche">${icon('x', 13)}</button></li>`}`;
}
// Sélection sans redessiner la ligne (l'intitulé en cours d'édition reste intact)
function setSelected(id) {
  if (UI.expanded === id) return;
  const prev = UI.expanded;
  UI.expanded = id;
  UI.addSubFor = null;
  for (const tid of [prev, id]) {
    if (!tid) continue;
    const el = document.querySelector(`.task[data-tid="${CSS.escape(tid)}"]`);
    const t = findTask(tid);
    if (!el || !t) continue;
    el.classList.toggle('open', tid === id);
    el.querySelector('.tbody').outerHTML = taskBodyHTML(t);
    el.querySelector('.row .meta').innerHTML = metaHTML(t);
  }
  autosize();
}
function autosize(el) {
  (el ? [el] : $$('textarea[data-autosize]')).forEach((ta) => { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 2 + 'px'; });
}

/* ================= Réunions ================= */
function meetingFormHTML(m) {
  return `<form class="mform" data-form="meeting" data-id="${m ? m.id : 'new'}" autocomplete="off">
    <input name="title" required placeholder="Intitulé (obligatoire)" value="${esc(m ? m.title : '')}" data-fk="mf-title-${m ? m.id : 'new'}">
    <div class="row2"><input type="date" name="date" value="${m && m.date ? m.date : ''}" title="Date (facultative)">
      <input name="category" list="catList" placeholder="Catégorie des sujets" value="${esc(m ? m.category || '' : '')}" title="Catégorie donnée aux sujets ajoutés depuis cette réunion"></div>
    <div class="btns"><button class="btn sm primary" type="submit">${m ? 'Enregistrer' : 'Créer'}</button><button class="btn sm" type="button" data-act="cancel-meeting">Annuler</button>
      ${m ? `<span class="spacer"></span><button class="btn sm danger" type="button" data-act="archive-meeting" data-id="${m.id}">${icon('trash', 14)}Supprimer</button>` : ''}</div>
  </form>`;
}
// Par défaut seule la prochaine réunion est dépliée ; un clic mémorise le choix.
function meetingCollapsed(m) {
  if (UI.mCollapsed[m.id] !== undefined) return !!UI.mCollapsed[m.id];
  const ms = activeMeetings();
  const t0 = today();
  const next = ms.filter((x) => x.date && x.date >= t0).sort((a, b) => a.date.localeCompare(b.date))[0] || ms[0];
  return !next || next.id !== m.id;
}
function renderMeetings() {
  const ms = activeMeetings();
  const t0 = today();
  let html = UI.meetingForm === 'new' ? meetingFormHTML(null) : '';
  if (!ms.length && UI.meetingForm !== 'new') html += `<div class="empty">Aucune réunion.<br>Crée une réunion puis tague des tâches pour préparer son ordre du jour.</div>`;
  for (const m of ms) {
    if (UI.meetingForm === m.id) { html += meetingFormHTML(m); continue; }
    const subjects = D.tasks.filter((t) => t.meetings.includes(m.id)).sort(cmpTask);
    const past = m.date && m.date < t0;
    const collapsed = meetingCollapsed(m);
    let when;
    if (m.date) {
      const n = diffDays(m.date, t0);
      const badge = past ? `<span class="badge">passée — à clôturer</span>` : n <= 7 ? `<span class="badge soon">${relDays(m.date)}</span>` : `<span>${relDays(m.date)}</span>`;
      when = `${icon('cal', 13)}<span>${esc(fmtDow(m.date))}</span>${badge}`;
    } else when = `<span>Date à fixer</span>${m.lastHeld ? `<span>· dernière le ${esc(fmtShort(m.lastHeld))}</span>` : ''}`;
    html += `<div class="mcard ${past ? 'past' : ''} ${collapsed ? 'collapsed' : ''}">
      <div class="mhead" data-act="toggle-mcard" data-id="${m.id}"><span class="caret">${icon('chev', 14)}</span>
        <div class="minfo"><div class="mtitle">${esc(m.title)}</div><div class="mdate">${when}</div></div>
        <span class="mcount" title="Sujets à l'ordre du jour">${subjects.length}</span>
        <button class="icon sm" data-act="edit-meeting" data-id="${m.id}" title="Modifier la réunion">${icon('edit', 14)}</button></div>
      <ul class="subjects">
        ${subjects.map((t) => `<li class="subject"><button class="chk sm" data-act="check-subject" data-id="${t.id}" data-mid="${m.id}" title="Sujet traité (→ historique)">${icon('check')}</button>
          <span class="stxt" data-act="goto-task" data-id="${t.id}" title="Voir dans la to-do (${esc(t.category || 'sans catégorie')})">${esc(t.title)}</span>${t.priority === 1 ? `<span class="prio p1 sm" title="Urgent / important">1</span>` : ''}</li>`).join('')}
        <li class="subject-add"><input placeholder="Ajouter un sujet… (Entrée)" data-enter="add-subject" data-mid="${m.id}" data-fk="as-${m.id}"></li>
      </ul>
      ${subjects.length ? `<div class="mfoot"><button class="btn sm block" data-act="close-meeting" data-mid="${m.id}" title="Tous les sujets passent dans l'historique">${icon('check', 14)}Réunion tenue : tout traiter</button></div>` : ''}
    </div>`;
  }
  $('#meetingList').innerHTML = html;
}

/* ================= Historique ================= */
function histFormRow2(h, prefix) {
  return `<div class="row2"><input name="category" list="catList" placeholder="Catégorie" value="${esc(h ? h.category : '')}" data-fk="${prefix}-cat">
    <input type="date" name="date" required value="${h ? h.date : today()}" data-fk="${prefix}-date"></div>`;
}
// Regroupe, dans une journée, les sous-tâches d'une même tâche parente (au lieu de répéter « ↳ parent » à chaque ligne)
function histDayHTML(list) {
  const groups = new Map();
  list.forEach((h) => { if (h.parent) { const k = h.parent + '\u0000' + (h.category || ''); groups.set(k, (groups.get(k) || 0) + 1); } });
  const done = new Set();
  let html = '';
  for (const h of list) {
    const k = h.parent ? h.parent + '\u0000' + (h.category || '') : null;
    if (!k || groups.get(k) < 2) { html += histRow(h); continue; }
    if (done.has(k)) continue;
    done.add(k);
    const members = list.filter((x) => x.parent && x.parent + '\u0000' + (x.category || '') === k);
    html += `<div class="hgroup"><div class="hghead"><i class="hdot" style="background:${catColor(h.category)}"></i><div class="htext"><span class="hgt">${esc(h.parent)}</span>${h.category ? ` <span class="hcat">${esc(h.category)}</span>` : ''}</div><span class="hgn" title="Sous-tâches faites ce jour">${members.length}</span></div>${members.map((x) => histRow(x, true)).join('')}</div>`;
  }
  return html;
}
function histRow(h, inGroup = false) {
  if (UI.histEditing === h.id) {
    return `<form class="hform" data-form="hist-edit" data-id="${h.id}" autocomplete="off">
      <input name="title" required value="${esc(h.title)}" data-fk="he-title">
      ${histFormRow2(h, 'he')}
      <div class="btns"><button class="btn sm primary" type="submit">Enregistrer</button><button class="btn sm" type="button" data-act="hist-cancel">Annuler</button><span class="spacer"></span>
        <button class="btn sm" type="button" data-act="hist-restore" data-id="${h.id}" title="Remettre dans la to-do">${icon('undo', 14)}Restaurer</button>
        <button class="btn sm danger" type="button" data-act="hist-del" data-id="${h.id}" title="Supprimer de l'historique">${icon('trash', 14)}</button></div>
    </form>`;
  }
  const c = findCat(h.category);
  const extra = [
    h.parent && !inGroup ? `<span title="Sous-tâche de">↳ ${esc(h.parent)}</span>` : '',
    ...(h.tags || []).map((x) => catTag(x)),
    ...(h.meetings || []).map((mid) => `<span class="chip meet sm">${icon('users')}${esc(meetingTitle(mid))}</span>`),
    h.note ? `<span>${esc(h.note)}</span>` : '',
  ].filter(Boolean).join('');
  return `<div class="hrow ${inGroup ? 'insub' : ''}"><i class="hdot" style="background:${catColor(h.category)}"></i><div class="htext">${esc(h.title)}${h.category && !inGroup ? ` <span class="hcat" title="${esc(c && c.desc ? c.name + ' — ' + c.desc : h.category)}">${esc(h.category)}</span>` : ''}${extra ? `<div class="hsub">${extra}</div>` : ''}</div>
    <button class="icon sm hedit" data-act="hist-edit" data-id="${h.id}" title="Modifier, changer la date, restaurer…">${icon('edit', 14)}</button></div>`;
}
function renderHistory() {
  const tokens = norm(UI.histQ).split(/\s+/).filter(Boolean);
  let items = D.history;
  if (tokens.length) {
    items = items.filter((h) => {
      const hay = norm([h.title, h.category, ...(h.tags || []), h.parent, h.note, ...(h.meetings || []).map(meetingTitle), h.date].join(' '));
      return tokens.every((k) => hay.includes(k));
    });
  }
  const byDay = new Map();
  const byWeek = new Map();
  for (const h of items) {
    if (!byDay.has(h.date)) byDay.set(h.date, []);
    byDay.get(h.date).push(h);
    const w = weekStart(h.date);
    byWeek.set(w, (byWeek.get(w) || 0) + 1);
  }
  const days = [...byDay.keys()].sort().reverse();
  const shown = days.slice(0, UI.histDays);
  const t0 = today();
  let html = '';
  if (UI.histAdd) {
    html += `<form class="hadd" data-form="hist-add" autocomplete="off"><div class="small muted">Ajouter une action réalisée (hors to-do)</div>
      <input name="title" required placeholder="Ce que j'ai fait…" data-fk="ha-title">${histFormRow2(null, 'ha')}
      <div class="btns" style="display:flex;gap:6px"><button class="btn sm primary" type="submit">Ajouter</button><button class="btn sm" type="button" data-act="hist-add-toggle">Fermer</button></div></form>`;
  }
  let lastWeek = null;
  for (const day of shown) {
    const ws = weekStart(day);
    if (ws !== lastWeek) {
      const w = isoWeek(day);
      html += `<div class="wsep">Semaine ${w.week}<span>${esc(fmtShort(ws))} – ${esc(fmtShort(addDays(ws, 6)))}</span><b>${byWeek.get(ws)}</b></div>`;
      lastWeek = ws;
    }
    const list = byDay.get(day);
    html += `<div class="day"><div class="dhead ${day === t0 ? 'today' : ''}"><span>${esc(fmtDay(day))}</span><span class="dcount">${list.length}</span></div>${histDayHTML(list)}</div>`;
  }
  if (days.length > shown.length) html += `<button class="btn sm more" data-act="hist-more">Afficher plus (${days.length - shown.length} jours)</button>`;
  if (!days.length) html += `<div class="empty">${tokens.length ? 'Aucun résultat.' : 'Rien pour le moment.<br>Les tâches et sous-tâches cochées arriveront ici, jour par jour.'}</div>`;
  $('#histList').innerHTML = html;
  const more = $('#histList .more');
  if (more && 'IntersectionObserver' in window) {
    const io = new IntersectionObserver((ents) => { if (ents.some((e) => e.isIntersecting)) { io.disconnect(); UI.histDays += 30; withFocus(renderHistory); } }, { root: $('#histList'), rootMargin: '200px' });
    io.observe(more);
  }
}

/* ================= Popovers (date, menus) / toasts / confirmation / modale ================= */
const POP = { resolve: null, key: null, render: null, catQ: '' };
function openPop(anchor, key, renderFn, width = 260) {
  const pop = $('#pop');
  // 2e clic sur le même déclencheur = fermer (le clic extérieur vient de fermer ce même menu)
  const same = (!pop.hidden && POP.key === key) || POP.justClosed === key;
  closePop(null);
  if (same) return false;
  POP.key = key;
  POP.render = renderFn;
  pop.style.width = width + 'px';
  pop.innerHTML = renderFn();
  pop.hidden = false;
  const r = anchor.getBoundingClientRect();
  const pw = pop.offsetWidth, ph = pop.offsetHeight;
  const left = Math.min(Math.max(8, r.left - 6), window.innerWidth - pw - 8);
  let top = r.bottom + 6;
  if (top + ph > window.innerHeight - 8) top = Math.max(8, r.top - ph - 6);
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  return true;
}
function refreshPop() { if (POP.render && !$('#pop').hidden) $('#pop').innerHTML = POP.render(); }
function closePop(value) {
  const pop = $('#pop');
  if (pop.hidden && !POP.resolve) return;
  pop.hidden = true;
  POP.key = null;
  POP.render = null;
  const r = POP.resolve;
  POP.resolve = null;
  if (r) r(value);
}
function askDate(anchor, { title = 'Fait le', def = today(), force = false } = {}) {
  if (!force && D.settings.askDate === false) return Promise.resolve(def);
  closePop(null);
  const y = addDays(today(), -1);
  openPop(anchor, 'date', () => `<div class="ph">${esc(title)}</div>
      <div class="pq"><button class="btn sm" data-act="pop-date" data-v="${today()}">Aujourd'hui</button><button class="btn sm" data-act="pop-date" data-v="${y}">Hier</button></div>
      <div class="pr"><input type="date" id="popDate" value="${def}" data-enter="pop-ok"><button class="btn sm primary" data-act="pop-ok">${icon('check', 14)}OK</button></div>
      <div class="small muted" style="margin-top:6px">Entrée pour valider · Échap pour annuler</div>`);
  $('#popDate').focus();
  return new Promise((resolve) => { POP.resolve = resolve; });
}
function prioMenuHTML(id) {
  const t = findTask(id);
  if (!t) return '';
  return `<div class="ph">Priorité</div><div class="menu">${[1, 2, 3, 0].map((v) => `<button class="mi ${(t.priority || 0) === v ? 'on' : ''}" data-act="set-prio" data-id="${id}" data-v="${v}"><span class="prio p${v}">${v || ''}</span><span class="ml">${v ? PRIO[v] : 'Aucune'}</span><kbd>${v}</kbd></button>`).join('')}</div>`;
}
function dueMenuHTML(id, sid) {
  const t = findTask(id);
  if (!t) return '';
  const s = sid ? t.subtasks.find((x) => x.id === sid) : null;

/* ================= Statistiques ================= */
const PERIODS = { '4w': '4 dernières semaines', '3m': '3 derniers mois', '6m': '6 derniers mois', '12m': '12 derniers mois', all: "tout l'historique" };
function periodStart(p) {
  const t = today();
  if (p === '4w') return weekStart(addDays(t, -21));
  if (p === '3m') return addMonths(t, -3);
  if (p === '6m') return addMonths(t, -6);
  if (p === '12m') return addMonths(t, -12);
  return D.history.reduce((m, h) => (h.date < m ? h.date : m), t);
}
function distribution(items) {
  const counts = new Map();
  items.forEach((x) => { const c = x.category || ''; counts.set(c, (counts.get(c) || 0) + 1); });
  const named = [], others = [];
  for (const [cat, n] of counts) { const slot = catSlot(cat); (slot ? named : others).push({ cat, n, slot }); }
  named.sort((a, b) => a.slot - b.slot || b.n - a.n);
  others.sort((a, b) => b.n - a.n);
  const series = named.map((x) => ({ key: x.cat, label: x.cat || 'Sans catégorie', color: `var(--s${x.slot})`, n: x.n }));
  const otherN = others.reduce((s, x) => s + x.n, 0);
  if (otherN) series.push({ key: '__other', label: 'Autres', color: 'var(--s0)', n: otherN, members: others });
  return { series, all: [...named, ...others].sort((a, b) => b.n - a.n), total: items.length };
}
const seriesKey = (cat) => (catSlot(cat) ? cat : '__other');
function niceTicks(max) {
  if (max <= 0) return [0, 1];
  const raw = max / 4;
  const mag = 10 ** Math.floor(Math.log10(raw));
  let step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((s) => s >= raw);
  step = Math.max(1, Math.round(step));
  const top = Math.ceil(max / step) * step;
  const out = [];
  for (let v = 0; v <= top; v += step) out.push(v);
  return out;
}
function arcPath(cx, cy, r0, r1, a0, a1) {
  if (a1 - a0 >= Math.PI * 2 - 1e-6) a1 = a0 + Math.PI * 2 - 1e-4;
  const large = a1 - a0 > Math.PI ? 1 : 0;
  const p = (r, a) => `${(cx + r * Math.sin(a)).toFixed(2)},${(cy - r * Math.cos(a)).toFixed(2)}`;
  return `M${p(r1, a0)}A${r1},${r1} 0 ${large} 1 ${p(r1, a1)}L${p(r0, a1)}A${r0},${r0} 0 ${large} 0 ${p(r0, a0)}Z`;
}
function topRounded(x, y, w, h, r) {
  r = Math.min(r, h, w / 2);
  return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
const pct = (n, total) => (total ? Math.round((n / total) * 100) : 0);
const TT = {};

function renderStats() {
  const body = $('#statsBody');
  const { period, source } = UI.stats;
  $('#stPeriod').value = period;
  $$('#stSource button').forEach((b) => b.classList.toggle('on', b.dataset.v === source));
  const t0 = today();
  const from = periodStart(period);
  const hist = D.history.filter((h) => h.date >= from && h.date <= t0);
  for (const k in TT) delete TT[k];

  // --- tuiles
  const weeks = [];
  for (let w = weekStart(from); w <= t0; w = addDays(w, 7)) weeks.push(w);
  const fullWeeks = Math.max(1, weeks.length - (weekStart(t0) === weeks[weeks.length - 1] ? 1 : 0));
  const histFull = hist.filter((h) => h.date < weekStart(t0)).length;
  const lateTasks = D.tasks.filter((t) => t.due && t.due < t0).length + D.tasks.reduce((n, t) => n + t.subtasks.filter((s) => !s.done && s.due && s.due < t0).length, 0);
  const p1 = D.tasks.filter((t) => t.priority === 1).length;
  let html = `<div class="tiles">
    <div class="tile"><div class="tl">Actions réalisées</div><div class="tv">${fmtInt(hist.length)}</div><div class="ts">${esc(PERIODS[period])}</div></div>
    <div class="tile"><div class="tl">Moyenne par semaine</div><div class="tv">${(histFull / fullWeeks).toLocaleString('fr-FR', { maximumFractionDigits: 1 })}</div><div class="ts">semaines complètes</div></div>
    <div class="tile"><div class="tl">Tâches ouvertes</div><div class="tv">${fmtInt(D.tasks.length)}</div><div class="ts">dont ${p1} en priorité 1</div></div>
    <div class="tile"><div class="tl">Échéances dépassées</div><div class="tv">${lateTasks ? `<span class="crit">${icon('alert', 20)}${lateTasks}</span>` : '0'}</div><div class="ts">tâches et sous-tâches</div></div>
  </div>`;

  // --- camembert
  const distItems = source === 'done' ? hist : D.tasks;
  const dist = distribution(distItems);
  const S = 220, R = 104, r0 = 64, cx = S / 2, cy = S / 2;
  let a = 0, slices = '';
  dist.series.forEach((s, i) => {
    const da = (s.n / dist.total) * Math.PI * 2;
    TT['p' + i] = `<div class="tt-h">${esc(s.label)}</div><div>${s.n} · ${pct(s.n, dist.total)} %</div>` + (s.members ? `<div class="small muted" style="margin-top:4px">${s.members.slice(0, 8).map((m) => esc(m.cat || 'Sans catégorie') + ' ' + m.n).join(' · ')}${s.members.length > 8 ? ' …' : ''}</div>` : '');
    slices += `<path class="mk" data-k="${esc(s.key)}" data-tt="p${i}" d="${arcPath(cx, cy, r0, R, a, a + da)}" style="fill:${s.color};stroke:var(--chart-surface);stroke-width:2"/>`;
    a += da;
  });
  const donut = dist.total
    ? `<svg viewBox="0 0 ${S} ${S}" width="${S}" height="${S}" role="img" aria-label="Répartition par catégorie">${slices}
        <text x="${cx}" y="${cy - 4}" text-anchor="middle" style="font-size:28px;font-weight:650;fill:var(--ink)">${dist.total}</text>
        <text x="${cx}" y="${cy + 16}" text-anchor="middle" class="axis-t">${source === 'done' ? 'actions' : 'tâches'}</text></svg>`
    : `<div class="empty">Aucune donnée sur la période.</div>`;
  // barres horizontales triées (plus lisibles qu'un anneau au-delà de 4–5 catégories) ; « Autres » toujours en dernier
  const maxBar = Math.max(1, ...dist.series.map((s) => s.n));
  const order = dist.series.map((s, i) => [s, i]).sort((a, b) => (a[0].members ? 1 : 0) - (b[0].members ? 1 : 0) || b[0].n - a[0].n);
  const legend = order.map(([s, i]) => `<div class="lg lgbar" data-k="${esc(s.key)}" data-tt="p${i}"><span class="nm"><i style="background:${s.color}"></i>${esc(s.label)}</span><span class="bt"><span class="bf" style="width:${(s.n / maxBar) * 100}%;background:${s.color}"></span></span><span class="n">${s.n}</span><span class="p">${pct(s.n, dist.total)} %</span></div>`).join('');
  html += `<div class="card"><h3>${source === 'done' ? 'Actions réalisées par catégorie' : 'Tâches ouvertes par catégorie'} <span class="muted" style="font-weight:500">· ${dist.total}</span></h3>
    <div class="sub-h">${source === 'done' ? esc(cap(PERIODS[period])) + ' · ' : ''}les catégories en couleur automatique sont regroupées dans « Autres » (couleurs réglables dans Réglages → Catégories)</div>
    ${dist.total ? `<div class="legend bars">${legend}</div>` : donut}</div>`;

  // --- barres empilées par semaine
  const wdist = distribution(hist);
  const keys = wdist.series.map((s) => s.key);
  const wk = weeks.map((w) => ({ w, total: 0, by: {} }));
  const idx = new Map(weeks.map((w, i) => [w, i]));
  hist.forEach((h) => { const row = wk[idx.get(weekStart(h.date))]; if (!row) return; const k = seriesKey(h.category); row.by[k] = (row.by[k] || 0) + 1; row.total++; });
  const innerW = Math.max(300, body.clientWidth - 40 - 34);
  const H = 250, ml = 34, mr = 6, mt = 10, mb = 26;
  const pw = innerW - ml - mr, ph = H - mt - mb;
  const ticks = niceTicks(Math.max(1, ...wk.map((x) => x.total)));
  const ymax = ticks[ticks.length - 1];
  const band = pw / Math.max(1, wk.length);
  const bw = Math.max(3, Math.min(24, band * 0.64));
  const y = (v) => mt + ph - (v / ymax) * ph;
  let svg = ticks.map((v) => `<line x1="${ml}" x2="${ml + pw}" y1="${y(v)}" y2="${y(v)}" stroke="${v === 0 ? 'var(--axis)' : 'var(--grid)'}" stroke-width="1"/><text class="axis-t" x="${ml - 6}" y="${y(v) + 3.5}" text-anchor="end">${v}</text>`).join('');
  const every = Math.max(1, Math.ceil(34 / band));
  const curWeek = weekStart(t0);
  wk.forEach((row, i) => {
    const x = ml + i * band + (band - bw) / 2;
    let base = mt + ph;
    const present = wdist.series.filter((s) => row.by[s.key]);
    present.forEach((s, j) => {
      const v = row.by[s.key];
      const h = (v / ymax) * ph;
      const top = j === present.length - 1;
      let yy = base - h, hh = h;
      if (!top && hh > 3) { yy += 2; hh -= 2; }
      svg += top ? `<path class="mk" data-k="${esc(s.key)}" d="${topRounded(x, yy, bw, Math.max(1, hh), 4)}" style="fill:${s.color}"/>` : `<rect class="mk" data-k="${esc(s.key)}" x="${x}" y="${yy}" width="${bw}" height="${Math.max(1, hh)}" style="fill:${s.color}"/>`;
      base -= h;
    });
    const wn = isoWeek(row.w).week;
    if (i % every === 0) svg += `<text class="axis-t" x="${x + bw / 2}" y="${H - 8}" text-anchor="middle">S${wn}</text>`;
    const rows = wdist.series.filter((s) => row.by[s.key]).sort((p, q) => row.by[q.key] - row.by[p.key]).map((s) => `<div class="tt-r"><i style="background:${s.color}"></i><span>${esc(s.label)}</span><b>${row.by[s.key]}</b></div>`).join('');
    TT['w' + i] = `<div class="tt-h">Semaine ${wn} · ${row.total} action${row.total > 1 ? 's' : ''}</div><div class="small muted" style="margin-bottom:4px">${esc(fmtShort(row.w))} – ${esc(fmtShort(addDays(row.w, 6)))}${row.w === curWeek ? ' (en cours)' : ''}</div>${rows || '<span class="muted">Aucune action</span>'}`;
    svg += `<rect x="${ml + i * band}" y="${mt}" width="${band}" height="${ph}" fill="transparent" data-tt="w${i}"/>`;
  });
  const wlegend = wdist.series.map((s) => `<span class="lg-i" data-k="${esc(s.key)}"><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join('');
  html += `<div class="card"><h3>Actions réalisées par semaine</h3><div class="sub-h">${esc(cap(PERIODS[period]))} · numéros de semaine ISO · survoler une barre pour le détail</div>
    ${hist.length ? `<div class="lg-inline">${wlegend}</div><svg id="weekSvg" width="${innerW}" height="${H}" viewBox="0 0 ${innerW} ${H}" role="img" aria-label="Actions réalisées par semaine">${svg}</svg>` : '<div class="empty">Aucune action sur la période.</div>'}</div>`;

  // --- détail (vue tableau)
  const maxN = Math.max(1, ...dist.all.map((x) => x.n));
  html += `<div class="card"><h3>Détail par catégorie</h3><div class="sub-h">${source === 'done' ? 'Actions réalisées · ' + esc(PERIODS[period]) : 'Tâches ouvertes'}</div>
    <div class="ranks">${dist.all.map((x) => `<span class="rl" title="${esc((findCat(x.cat) || {}).desc || '')}"><i style="background:${catColor(x.cat)}"></i>${esc(x.cat || 'Sans catégorie')}</span>
      <span><div class="rb" style="width:${(x.n / maxN) * 100}%;background:${catColor(x.cat)}"></div></span><span class="rn">${x.n}</span><span class="rp">${pct(x.n, dist.total)} %</span>`).join('')}</div></div>`;
  body.innerHTML = html;
}

function statsHover(e) {
  const tt = $('#tooltip');
  const el = e.target.closest('[data-tt]');
  const kel = e.target.closest('[data-k]');
  $$('#statsBody svg').forEach((s) => {
    const k = kel ? kel.dataset.k : null;
    s.classList.toggle('hl', !!k);
    if (k) $$('.mk', s).forEach((m) => m.classList.toggle('on', m.dataset.k === k));
  });
  if (!el || !TT[el.dataset.tt]) { tt.hidden = true; return; }
  tt.innerHTML = TT[el.dataset.tt];
  tt.hidden = false;
  const w = tt.offsetWidth, h = tt.offsetHeight;
  let x = e.clientX + 14, yy = e.clientY + 14;
  if (x + w > window.innerWidth - 8) x = e.clientX - w - 14;
  if (yy + h > window.innerHeight - 8) yy = e.clientY - h - 14;
  tt.style.left = x + 'px';
  tt.style.top = yy + 'px';
}

    { id: 'gpt-5.6-sol', label: 'GPT-5.6 Sol — le plus fin', in: 4, out: 20, cr: 0.40 },
  ],
};
const AI_KEY = 'todo-ipparis.ai';
const AI_BUDGET_TOKENS = 90000; // reste sous le palier « long contexte » de Haiku (100 k)
function aiCfg() {
  return Object.assign({ provider: 'anthropic', keyA: '', keyO: '', modelA: 'claude-haiku-5-5', modelO: 'gpt-5.6-luna', custom: '', cIn: '', cOut: '', months: 6, maxCost: 0.05 }, LS.get(AI_KEY, {}));
}
function setAiCfg(patch) { LS.set(AI_KEY, Object.assign(aiCfg(), patch)); }
function aiModel(cfg = aiCfg()) {
  const id = cfg.provider === 'anthropic' ? cfg.modelA : cfg.modelO;
  if (id === '__custom') {
    return { id: cfg.custom.trim(), label: cfg.custom.trim() || 'modèle personnalisé', in: parseFloat(cfg.cIn) || null, out: parseFloat(cfg.cOut) || null, custom: true };
  }
  return MODELS[cfg.provider].find((m) => m.id === id) || MODELS[cfg.provider][0];
}
const aiKey = (cfg = aiCfg()) => (cfg.provider === 'anthropic' ? cfg.keyA : cfg.keyO).trim();
const estTokens = (s) => Math.ceil(s.length / 3.1);
function priceIn(m, promptTok) { return m.longAt && promptTok > m.longAt ? m.longMul : 1; }
function estCost(m, inTok, outTok = 700) {
  if (m.in == null || m.out == null) return null;
  const mul = priceIn(m, inTok);
  return (inTok * m.in * mul + outTok * m.out * mul) / 1e6;
}
function fmtUSD(x) {
  if (x == null) return '? $';
  if (x < 0.001) return '< 0,001 $';
  return x.toLocaleString('fr-FR', { minimumFractionDigits: x < 0.1 ? 3 : 2, maximumFractionDigits: x < 0.1 ? 4 : 2 }) + ' $';
}

const AI_SYSTEM = `Tu es l'assistant de suivi de travail de l'utilisateur (direction de la recherche, IP Paris). Tu reçois un export de sa to-do (tâches ouvertes avec priorité, échéance, réunions, sous-tâches), de ses réunions à venir et de son historique d'actions réalisées.
Règles :
- Réponds en français, de façon concise et structurée (titres courts, listes, petits tableaux si utile). Pas de préambule.
- Appuie-toi uniquement sur les données fournies ; si une information manque, dis-le.
- Pour tout comptage ou volume, utilise les AGRÉGATS EXACTS fournis plutôt que de recompter les lignes. Les sigles des catégories sont expliqués en tête (ex. GO = Grants Office).
- Cite les tâches telles qu'elles sont écrites.
- Pour les priorités : combine priorité (P1 > P2 > P3), échéances (dépassées puis proches), réunions à venir (sujets à préparer) et ancienneté ; signale ce qui semble bloqué ou en attente d'un tiers.
- L'historique ne couvre que la période indiquée ; précise-le si la question déborde.`;

function buildAIContext(months) {
  const t0 = today();
  const w = isoWeek(t0);
  const from = months > 0 ? addMonths(t0, -months) : '0000-00-00';
  const L = [];
  L.push(`# DONNÉES DE SUIVI — export du ${fmtLong(t0)} (${t0}, semaine ISO ${w.week})`);
  L.push('Priorités : P1 = urgent/important, P2 = à faire, P3 = pas urgent, P- = non définie.');
  const sig = D.categories.filter((c) => c.desc);
  if (sig.length) L.push('Sigles des catégories : ' + sig.map((c) => `${c.name} = ${c.desc}`).join(' ; ') + '.');

  L.push('', "## RÉUNIONS ET SUJETS À L'ORDRE DU JOUR");
  const ms = activeMeetings();
  if (!ms.length) L.push('(aucune)');
  for (const m of ms) {
    const subs = D.tasks.filter((t) => t.meetings.includes(m.id));
    L.push(`- ${m.title} — ${m.date ? m.date + ' (' + relDays(m.date) + ')' : 'date non fixée'}${m.lastHeld ? ' — dernière tenue ' + m.lastHeld : ''} — ${subs.length} sujet(s)`);
    subs.forEach((s) => L.push(`  • ${s.title}`));
  }

  L.push('', `## TÂCHES OUVERTES (${D.tasks.length}) — format : [priorité] intitulé | échéance | réunion`);
  const byCat = new Map();
  D.tasks.forEach((t) => { const k = t.category || 'Sans catégorie'; if (!byCat.has(k)) byCat.set(k, []); byCat.get(k).push(t); });
  for (const name of [...D.categories.map((c) => c.name), 'Sans catégorie']) {
    const list = byCat.get(name);
    if (!list) continue;
    L.push(`### ${name} (${list.length})`);
    [...list].sort((a, b) => prioRank(a.priority) - prioRank(b.priority)).forEach((t) => {
      const parts = [`[P${t.priority || '-'}] ${t.title}`];
      if (t.due) parts.push(`éch. ${t.due}${t.due < t0 ? ' (DÉPASSÉE)' : ''}`);
      if (t.meetings.length) parts.push('réunion : ' + t.meetings.map(meetingTitle).join(', '));
      if (t.created) parts.push('créée ' + t.created);
      L.push(parts.join(' | '));
      t.subtasks.forEach((s) => L.push(`   - ${s.done ? '[fait ' + (s.doneDate || '') + '] ' : ''}${s.title}${s.due ? ' | éch. ' + s.due : ''}`));
      if (t.notes) L.push(`   note : ${t.notes.replace(/\s+/g, ' ')}`);
    });
  }

  const hist = D.history.filter((h) => h.date >= from && h.date <= t0);
  const realFrom = hist.reduce((m, h) => (h.date < m ? h.date : m), t0);
  const monthsList = [];
  for (let m = realFrom.slice(0, 7); m <= t0.slice(0, 7); m = addMonths(m + '-01', 1).slice(0, 7)) monthsList.push(m);
  const tab = new Map();
  hist.forEach((h) => {
    for (const c of [h.category || 'Sans catégorie']) {
      if (!tab.has(c)) tab.set(c, {});
      const r = tab.get(c);
      const mm = h.date.slice(0, 7);
      r[mm] = (r[mm] || 0) + 1;
      r.total = (r.total || 0) + 1;
    }
  });
  L.push('', `## AGRÉGATS EXACTS DE L'HISTORIQUE — du ${realFrom} au ${t0} : ${hist.length} actions (à utiliser pour tout comptage)`);
  L.push(`Catégorie | ${monthsList.join(' | ')} | Total`);
  [...tab.entries()].sort((a, b) => b[1].total - a[1].total).forEach(([c, r]) => L.push(`${c} | ${monthsList.map((m) => r[m] || 0).join(' | ')} | ${r.total}`));
  const perWeek = new Map();
  hist.forEach((h) => { const ws = weekStart(h.date); perWeek.set(ws, (perWeek.get(ws) || 0) + 1); });
  L.push('Par semaine ISO : ' + [...perWeek.entries()].sort().map(([ws, n]) => `S${isoWeek(ws).week} (${ws}) ${n}`).join(' ; '));
  const tagged = hist.filter((h) => (h.tags || []).length);
  if (tagged.length) L.push(`Note : ${tagged.length} actions portent aussi une catégorie secondaire (indiquée après « + » dans le détail) ; elles ne sont comptées que dans leur catégorie principale.`);
  if (months > 0 && D.history.some((h) => h.date < from)) L.push(`Historique plus ancien non inclus : ${D.history.filter((h) => h.date < from).length} actions avant le ${from}.`);

  const head = L.join('\n');
  // Détail jour par jour, du plus récent au plus ancien, tronqué si le budget est dépassé
  const byDay = new Map();
  hist.forEach((h) => { if (!byDay.has(h.date)) byDay.set(h.date, []); byDay.get(h.date).push(h); });
  const blocks = [...byDay.keys()].sort().reverse().map((day) => {
    const d = parseISO(day);
    const lines = [`${day} (${JOURS_C[d.getDay()]})`];
    byDay.get(day).forEach((h) => {
      const extra = [h.parent ? 'sous-tâche de : ' + h.parent : '', h.meetings.length ? 'réunion : ' + h.meetings.map(meetingTitle).join(', ') : '', h.note || ''].filter(Boolean).join(' ; ');
      lines.push(`- [${h.category || '?'}${(h.tags || []).map((x) => ' + ' + x).join('')}] ${h.title}${extra ? ' (' + extra + ')' : ''}`);
    });
    return lines.join('\n');
  });
  let budget = AI_BUDGET_TOKENS * 3.1 - head.length - AI_SYSTEM.length - 400;
  const kept = [];
  for (const b of blocks) { if (budget - b.length < 0) break; kept.push(b); budget -= b.length + 1; }
  let detail = `\n\n## HISTORIQUE DÉTAILLÉ (du plus récent au plus ancien)\n` + kept.join('\n');
  if (kept.length < blocks.length) detail += `\n(détail tronqué : jours antérieurs au ${[...byDay.keys()].sort().reverse()[kept.length - 1]} omis ; les agrégats restent complets)`;
  return head + detail;
}

function aiContextInfo() {
  const cfg = aiCfg();
  const ctx = buildAIContext(cfg.months);
  const tok = estTokens(AI_SYSTEM + ctx);
  return { ctx, tok, cost: estCost(aiModel(cfg), tok) };
}

async function callAnthropic(key, model, ctx, conv) {
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({
      model: model.id, max_tokens: 2500,
      system: [{ type: 'text', text: AI_SYSTEM }, { type: 'text', text: ctx, cache_control: { type: 'ephemeral' } }],
      messages: conv,
    }),
  });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(apiError('Anthropic', r.status, j.error && j.error.message));
  const u = j.usage || {};
  const inTok = u.input_tokens || 0, cw = u.cache_creation_input_tokens || 0, cr = u.cache_read_input_tokens || 0, out = u.output_tokens || 0;
  const mul = priceIn(model, inTok + cw + cr);
  const cost = model.in == null ? null : ((inTok * model.in + cw * (model.cw ?? model.in * 1.25) + cr * (model.cr ?? model.in * 0.1)) * mul + out * model.out * mul) / 1e6;
  return { text: (j.content || []).filter((b) => b.type === 'text').map((b) => b.text).join('\n').trim(), inTok: inTok + cw + cr, cached: cr, out, cost };
}
async function callOpenAI(key, model, ctx, conv) {
  const body = { model: model.id, messages: [{ role: 'system', content: AI_SYSTEM + '\n\n' + ctx }, ...conv], max_completion_tokens: 6000 };
  const reasoning = /^(gpt-5|o\d)/.test(model.id);
  if (reasoning) body.reasoning_effort = 'low';
  const send = (b) => fetch('https://api.openai.com/v1/chat/completions', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + key }, body: JSON.stringify(b) });
  let r = await send(body);
  let j = await r.json().catch(() => ({}));
  if (!r.ok && r.status === 400 && reasoning && /reasoning/i.test((j.error && j.error.message) || '')) {
    delete body.reasoning_effort;
    r = await send(body);
    j = await r.json().catch(() => ({}));
  }
  if (!r.ok) throw new Error(apiError('OpenAI', r.status, j.error && j.error.message));
  const u = j.usage || {};
  const inTok = u.prompt_tokens || 0, cr = (u.prompt_tokens_details && u.prompt_tokens_details.cached_tokens) || 0, out = u.completion_tokens || 0;
  const cost = model.in == null ? null : ((inTok - cr) * model.in + cr * (model.cr ?? model.in) + out * model.out) / 1e6;
  const text = (j.choices && j.choices[0] && j.choices[0].message && j.choices[0].message.content) || '';
  return { text: text.trim() || '(réponse vide — augmenter la limite ou réessayer)', inTok, cached: cr, out, cost };
}
function apiError(who, status, msg) {
  if (status === 401) return `${who} : clé API refusée (401). Vérifie la clé dans les réglages.`;
  if (status === 404) return `${who} : modèle introuvable (404). ${msg || ''}`;
  if (status === 429) return `${who} : quota ou limite de débit atteint (429). ${msg || ''}`;
  return `${who} : erreur ${status}. ${msg || ''}`;
}

async function aiSend(text) {
  text = String(text || '').trim();
  if (!text || UI.chatBusy) return;
  const cfg = aiCfg();
  const key = aiKey(cfg);
  if (!key) { openSettings(); return; }
  const model = aiModel(cfg);
  if (!model.id) { openSettings(); return; }
  const ctx = buildAIContext(cfg.months);
  const conv = [];
  for (const m of UI.chat) if ((m.role === 'user' && !m.failed) || m.role === 'assistant') conv.push({ role: m.role, content: m.text });
  conv.push({ role: 'user', content: text });
  while (conv.length > 11) conv.shift();
  while (conv.length && conv[0].role !== 'user') conv.shift();
  const inTok = estTokens(AI_SYSTEM + ctx + conv.map((c) => c.content).join('\n'));
  const est = estCost(model, inTok);
  if (est != null && est > cfg.maxCost) {
    const ok = await confirmBox(`Cette question coûterait environ ${fmtUSD(est)} avec ${model.label} (≈ ${fmtInt(inTok)} tokens envoyés), au-dessus de ton seuil d'alerte (${fmtUSD(cfg.maxCost)}).\n\nEnvoyer quand même ?`, { ok: 'Envoyer' });
    if (!ok) return;
  }
  const userMsg = { role: 'user', text };
  UI.chat.push(userMsg);
  UI.chatBusy = true;
  $('#aiInput').value = '';
  renderAI();
  try {
    const r = cfg.provider === 'anthropic' ? await callAnthropic(key, model, ctx, conv) : await callOpenAI(key, model, ctx, conv);
    UI.chat.push({ role: 'assistant', text: r.text, meta: Object.assign(r, { model: model.label.split(' — ')[0] }) });
  } catch (e) {
    userMsg.failed = true;
    const msg = e instanceof TypeError ? `Connexion impossible à l'API (réseau, proxy de l'établissement ou blocage). Détail : ${e.message}` : e.message;
    UI.chat.push({ role: 'error', text: msg });
  }
  UI.chatBusy = false;
  renderAI();
}

function mdInline(s) {
  return s.replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;:!?]|$)/g, '$1<em>$2</em>');
}
function md(src) {
  const lines = esc(src).split('\n');
  let out = '', list = null, i = 0;
  const closeList = () => { if (list) { out += `</${list}>`; list = null; } };
  const isRow = (l) => /^\s*\|.*\|\s*$/.test(l);
  while (i < lines.length) {
    const l = lines[i];
    if (isRow(l) && i + 1 < lines.length && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1])) {
      closeList();
      const cells = (row) => row.trim().replace(/^\||\|$/g, '').split('|').map((c) => mdInline(c.trim()));
      out += '<table><thead><tr>' + cells(l).map((c) => `<th>${c}</th>`).join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < lines.length && isRow(lines[i])) { out += '<tr>' + cells(lines[i]).map((c) => `<td>${c}</td>`).join('') + '</tr>'; i++; }
      out += '</tbody></table>';
      continue;
    }
    const h = l.match(/^(#{1,4})\s+(.*)/);
    if (h) { closeList(); const n = Math.min(h[1].length + 2, 5); out += `<h${n}>${mdInline(h[2])}</h${n}>`; i++; continue; }
    const ul = l.match(/^\s*[-*•]\s+(.*)/), ol = l.match(/^\s*\d+[.)]\s+(.*)/);
    if (ul || ol) {
      const type = ul ? 'ul' : 'ol';
      if (list !== type) { closeList(); out += `<${type}>`; list = type; }
      out += `<li>${mdInline((ul || ol)[1])}</li>`;
      i++;
      continue;
    }
    closeList();
    if (!l.trim()) { i++; continue; }
    const para = [l];
    i++;
    while (i < lines.length && lines[i].trim() && !/^(#{1,4}\s|\s*[-*•]\s|\s*\d+[.)]\s|\s*\|)/.test(lines[i])) { para.push(lines[i]); i++; }
    out += `<p>${para.map(mdInline).join('<br>')}</p>`;
  }
  closeList();
  return out;
}

/* ================= Thème ================= */
function applyTheme() {
  if (UI.theme === 'auto') delete document.documentElement.dataset.theme;
  else document.documentElement.dataset.theme = UI.theme;
}

/* ================= Saisie rapide ================= */
function parseQuick(text) {
  const r = {};
  let s = ' ' + text + ' ';
  s = s.replace(/\s!([123])(?=\s)/, (m, p) => { r.priority = Number(p); return ' '; });
  s = s.replace(/\s#([^\s#@!>]+)/, (m, c) => { const f = matchCat(c); r.category = f ? f.name : c.replace(/_/g, ' '); return ' '; });
  s = s.replace(/\s@([^\s#@!>]+)/, (m, q) => { const f = matchMeeting(q); if (f) { r.meeting = f.id; return ' '; } return m; });
  s = s.replace(/\s>(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/, (m, dd, mm, yy) => {
    const t0 = today();
    let y = yy ? Number(yy.length === 2 ? '20' + yy : yy) : Number(t0.slice(0, 4));
    let iso = `${y}-${pad(mm)}-${pad(dd)}`;
    if (!yy && iso < t0) iso = `${y + 1}-${pad(mm)}-${pad(dd)}`;
    if (isISODate(iso) && !isNaN(parseISO(iso))) { r.due = iso; return ' '; }
    return m;
  });
  r.title = s.replace(/\s+/g, ' ').trim();
  return r;
}

const CHANGES = {
  'task-title': (el, t) => { const v = el.value.trim(); if (!v) { el.value = t.title; return; } if (v !== t.title) mutate('intitulé', () => { t.title = v; }); },
